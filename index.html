<title>Blood on the Clocktower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: felt table with the seating clock on the left, the storyteller's guided panel on the right; stacks on phones. Player screens cover everything. */
:root{

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--body)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}
h1{font:400 1.6rem/1 var(--display);margin:0;color:var(--brass)}
.appscript{font:400 .95rem var(--body);color:var(--muted);letter-spacing:0;text-shadow:none;margin-left:6px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--felt2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;line-height:1.2}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:#1b1608;border-color:var(--brass);font-weight:700}
.btn.big{padding:12px 18px;font-size:1.05rem;width:100%}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn.danger{border-color:var(--demon);color:#ffb3ab}
.btn.evil{background:#4a1612;border-color:var(--demon)}

.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.table{background:radial-gradient(circle at 50% 48%,#3a1c18 0,#24120f 48%,#150b09 72%),var(--felt);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:inset 0 0 60px #000c,inset 0 0 0 6px #2a1813,inset 0 0 0 7px #4a3222;transition:background .8s}
.circle{position:relative;width:100%;max-width:660px;aspect-ratio:1;margin:0 auto;--seat:clamp(46px,10.5vw,76px)}
.circle::before{content:"";position:absolute;inset:8%;border-radius:50%;border:1px solid #5a402b66;box-shadow:0 0 0 6px #00000033,inset 0 0 40px #0008}
.center{position:absolute;inset:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.center .ph{font:400 clamp(1.4rem,4.5vw,2.4rem)/1 var(--display);color:var(--brass)}
.center .stat{font-variant-numeric:tabular-nums;font-size:clamp(.75rem,2.2vw,.95rem)}
.center .stat b{font:400 clamp(1.3rem,4vw,2rem)/1 var(--display);color:var(--vote);display:block}
.seat{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:calc(var(--seat)*1.45)}
.tok{width:var(--seat);height:var(--seat);border-radius:50%;display:block;position:relative;box-shadow:0 3px 8px #000a,0 0 0 2px var(--c,#0000);transition:filter .5s,box-shadow .3s,transform .2s}
.seat.townsfolk{--c:var(--town)}.seat.outsider{--c:var(--out)}.seat.minion{--c:var(--minion)}.seat.demon{--c:var(--demon)}
.seat.blank .tok{filter:saturate(.3) brightness(.7)}

.seat.waking .tok{box-shadow:0 0 0 4px var(--ink),0 0 18px var(--ink)}

.seat.voting .tok{box-shadow:0 0 0 4px var(--vote),0 0 16px var(--vote)}
.seat.voting .pname::before{content:"✋ "}
.seat.nominee .tok{box-shadow:0 0 0 4px var(--demon)}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--warn)}}

.tokensvg{width:100%;height:100%;display:block;border-radius:50%}
.tokimg{object-fit:cover;background:#e2cfa3}
.mini{display:block;border-radius:50%;box-shadow:0 1px 4px #0009}
.tokring{stroke:#7a5a32;stroke-width:1.2;opacity:.55}
.glyph{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.glyph.good{stroke:#1f4f8a}.glyph.evil{stroke:#9b1d18}
.tokname{font-family:var(--display);fill:#24180b;font-weight:700;letter-spacing:.01em}
.toknum{font:400 30px var(--display);fill:#5a4a30}

.seat.waking .tok{animation:wake 1.6s ease-in-out infinite}

.show{animation:showin .22s ease-out}

.pop,.menu{animation:popin .14s ease-out}

.menu{animation-name:menuin}
@keyframes menuin{from{opacity:0;transform:scale(.96)}}
.recap .card{animation:recapin .22s ease-out}

body{transition:background .8s}

.cbtn{flex-direction:row;align-items:flex-start;gap:8px}

.script .srow .mini{width:32px;height:32px;flex:none;border-radius:50%}
h1{font-size:1.75rem;letter-spacing:.02em;text-shadow:0 2px 0 #000}
@media (prefers-reduced-motion:reduce){.seat.waking .tok,.show,.pop,.menu,.recap .card{animation:none}.seat.waking .tok{box-shadow:0 0 0 4px var(--ink)}}

.marks{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}

.chip.poison{--k:var(--poison)}.chip.safe{--k:var(--safe)}.chip.drunk{--k:var(--warn)}.chip.info{--k:var(--brass)}.chip.muted{--k:var(--muted)}.chip.evil{--k:var(--demon)}.chip.good{--k:var(--town)}
.chip.off{opacity:.55;text-decoration:line-through}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted);font-weight:700;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--brass)}
h2{font:400 1.3rem var(--display);margin:0 0 8px;color:var(--brass)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.script{display:flex;flex-direction:column;gap:6px}

.reveal li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.show{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));border:0;width:100%;cursor:pointer}

}

.voiceon{border-color:var(--brass)!important;color:var(--brass)}
:root.night{--bg:#07090f;--felt:#0f121a;--felt2:#151a24;--line:#262c3b;--ink:#d8d0bd}
:root.night .table{background:radial-gradient(circle at 50% 48%,#18203a 0,#0e1222 48%,#07080f 72%)}
.show .slines{display:flex;flex-direction:column;gap:12px;max-width:44ch}
.show .slines p{margin:0;font:400 clamp(1.2rem,3.6vw,1.9rem)/1.25 var(--display);border:1px solid var(--line);border-radius:12px;padding:12px 18px;background:#0005}
.savant{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--bg)}
.savant div{margin:4px 0}.savant .t{color:var(--town)}.savant .f{color:#ff8a80}
.spyg{position:relative;width:min(88vmin,860px);aspect-ratio:1;margin:auto}
.spyg .ss{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:15vmin;max-width:150px}
.spyg .ss .tk{width:min(10vmin,96px);height:min(10vmin,96px);border-radius:50%;box-shadow:0 2px 8px #000a}
.spyg .ss .tk .tokensvg{width:100%;height:100%}
.spyg .ss.dead .tk{filter:grayscale(1) brightness(.55)}
.spyg .ss b{font:700 clamp(.7rem,1.6vmin,.95rem) var(--body);color:var(--ink)}
.spyg .ss .chips{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.spyg .ss .chip{font-size:clamp(.55rem,1.2vmin,.7rem)}
.spyg .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 clamp(1.2rem,4vmin,2.2rem) var(--display);color:var(--brass);pointer-events:none}
.show .hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--muted)}
.show .qr{width:min(74vmin,540px);height:auto;border-radius:10px;box-shadow:0 8px 30px #000c}
.phone{max-width:640px;margin:0 auto}
.pnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pnames .btn{justify-content:center;padding:14px 10px;font-size:1.05rem}
.pready{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:18px}
.cview{cursor:default}
.show .bluffs{justify-content:center;gap:clamp(10px,3vw,24px)}
.show .bluffs .bigtoken{width:clamp(84px,14vw,140px);height:clamp(84px,14vw,140px)}
.ccc{height:30px;width:auto;opacity:.9}
.cccnote{display:flex;align-items:center;gap:10px;font-size:.78rem;margin-top:8px}
.mode .scard{display:flex;flex-direction:column;min-width:0}
.mode .scard > button:first-child{flex:1;border-radius:10px 10px 0 0}
.mode button.sprev{border-top:0;border-radius:0 0 10px 10px;padding:6px 10px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.preview{position:fixed;inset:0;z-index:50;background:#000b;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.preview .sheetimg{display:block;width:100%;height:auto;border-radius:8px;margin-top:12px}
@media (max-width:600px){.preview{padding:8px}.preview .pinner{padding:10px}}
.preview .pinner{max-width:760px;margin:0 auto;background:var(--felt);border:1px solid var(--line);border-radius:14px;padding:16px}
.pbtn{width:100%;justify-content:center;padding:16px 18px;font-size:1.15rem}
</style>

/* ---------- setup ---------- */
const legionN = () => Math.floor(S.players.length/2)+1;
const copies = k => k==='legion' ? legionN() : 1;
function outsiderDeltas(){
  let ds = [0];
  const add = opts => { ds = [...new Set(ds.flatMap(d=>opts.map(o=>d+o)))]; };
  const c = S.chosen;
  if(c.includes('baron')) add([2]);
  if(c.includes('fanggu')) add([1]);
  if(c.includes('vigormortis')) add([-1]);
  if(c.includes('godfather')) add([-1,1]);

  if(c.includes('gatekeeper')) add([0,1]);

  return ds.sort((a,b)=>a-b);
}
function targets(){
  const n = S.players.length; let [t,o,m,d] = DIST[n];
  if(S.chosen.includes('legion')){ d = legionN(); m = 0; o = Math.min(o, n-d); }
  const opts = [...new Set(outsiderDeltas().map(x=>o+x))].filter(x=>x>=0 && x<=n-m-d).sort((a,b)=>a-b);
  const oc = chosenCount('outsider'), oT = opts.includes(oc) ? oc : opts.reduce((b,x)=>Math.abs(x-oc)<Math.abs(b-oc)?x:b, opts[0]??o);
  return {townsfolk:n-m-d-oT, outsider:oT, minion:m, demon:d, oOpts:opts};
}
const chosenCount = t => S.chosen.filter(k=>R[k].team===t).reduce((s,k)=>s+copies(k),0);
const bagTotal = () => S.chosen.reduce((s,k)=>s+copies(k),0);
function bagOK(){
  const tg = targets();
  return bagTotal()===S.players.length && chosenCount('demon')===tg.demon && chosenCount('minion')===tg.minion && tg.oOpts.includes(chosenCount('outsider'));
}
function fillChars(){
  const pickFrom = (t, want) => { const bag = shuffle(pool(t).filter(k=>!S.chosen.includes(k))); while(chosenCount(t)<want && bag.length){ const k = bag.shift(); if(chosenCount(t)+copies(k)<=want || t==='demon') S.chosen.push(k); } };
  if(!chosenCount('demon')){ const bag = shuffle(pool('demon')); if(bag.length) S.chosen.push(bag[0]); }
  pickFrom('minion', targets().minion);
  if(S.chosen.includes('choirboy') && !S.chosen.includes('king') && pool('townsfolk').includes('king')) S.chosen.push('king');
  let tg = targets();
  const oNow = chosenCount('outsider'), oWant = tg.oOpts.includes(oNow) ? Math.max(oNow, rnd(tg.oOpts.filter(x=>x>=oNow))??oNow) : (tg.oOpts.filter(x=>x>=oNow)[0] ?? oNow);
  pickFrom('outsider', oWant);
  tg = targets(); pickFrom('outsider', tg.outsider);
  const room = S.players.length - bagTotal();
  pickFrom('townsfolk', chosenCount('townsfolk') + room);
}
function pickBluffs(){

  const free = [...pool('townsfolk'),...pool('outsider')].filter(r=>!used.has(r)), odd = k => ['drunk','lunatic'].includes(k);
  return [...shuffle(free.filter(k=>!odd(k))), ...shuffle(free.filter(odd))].slice(0,3);
}
function setupMarks(){
  ['redherring','fauxpaw','twin','eviltf'].forEach(dropRem);
  S.players.forEach(p=>{ if(p.align && has(p,'eviltf')) p.align = null; });
  const good = ex => S.players.filter(p=>!isEvil(p) && p!==ex);
  const ft = S.players.find(p=>wake(p)==='fortuneteller'); if(ft){ const g = rnd(good(ft)); if(g) addRem(g,'redherring'); }
  const ly = S.players.find(p=>p.role==='lycanthrope'); if(ly){ const g = rnd(good(ly)); if(g) addRem(g,'fauxpaw'); }
  const et = S.players.find(p=>p.role==='eviltwin'); if(et){ const g = rnd(good(et)); if(g) addRem(g,'twin'); }
  const bh = S.players.find(p=>p.role==='bountyhunter'); if(bh){ const g = rnd(S.players.filter(p=>team(p)==='townsfolk' && p!==bh)); if(g){ g.align='evil'; addRem(g,'eviltf'); } }
}
function dealSeats(){

/* ---------- deaths & wins ---------- */
const night = () => S.phase.kind==='night';
function endAbility(p){
  const stop = (type, what) => { if(S.players.some(q=>has(q,type)) && !S.players.some(q=>q!==p && q.alive && abilityOf(q)===abilityOf(p))){ dropRem(type); log(`${what} ends, because the ${R[abilityOf(p)].name} lost their ability.`); } };
  const k = abilityOf(p);
  if(k==='poisoner') stop('poisoned','Their poison');
  if(k==='widow') stop('widowpoison',"The Widow's poison");
  if(k==='pukka') stop('pukka',"The Pukka's poison");
  if(k==='witch') stop('cursed',"The Witch's curse");
  if(k==='vigormortis'){ stop('vigorpoison',"The Vigormortis poison"); dropRem('undead'); }
}
function kill(p,cause){
  if(!p.alive) return false;
  if(abilityOf(p)==='fool' && !impaired(p) && !has(p,'noability')){ addRem(p,'noability'); log(`${p.name} would have died (${cause}), but the Fool survives the first time.`); return false; }
  const day = !night();
  if(p.role==='zombuul' && !impaired(p) && !has(p,'zombfirst')){
    addRem(p,'zombfirst'); p.fake = true; if(!day) addRem(p,'diedtonight'); else S.day.anyDied = true;
    log(`${p.name} (Zombuul) seems to die (${cause}) but secretly lives. Treat them as dead in public.`); return true;
  }
  const before = alive().length;
  p.alive = false; p.fake = false;
  if(!day) addRem(p,'diedtonight'); else { S.day.anyDied = true; if(team(p)==='outsider') S.day.outsiderDied = true; }
  log(`${p.name} dies (${cause}).`);
  if(!has(p,'undead')) endAbility(p);
  if(hasAbility(p,'barber')) S.haircut = true;
  if(has(p,'pixiemad') && S.players.some(q=>q.alive && abilityOf(q)==='pixie')) log(`If the Pixie was "mad" about being the ${R[p.role].name}, they now have that ability. Set it on the Pixie's notes.`);
  for(const k of ['klutz','moonchild']) if(hasAbility(p,k) && !impaired(p)){
    if(day){ ui.pick = {kind:k, actor:p.id}; } else (S.pending ||= []).push({kind:k, actor:p.id});
  }
  if(isDemon(p) && !alive().some(isDemon)){
    const sw = S.players.find(q=>q.alive && abilityOf(q)==='scarletwoman' && !impaired(q));
    if(sw && before>=5){ sw.role = p.role; sw.as = null; sw.align = 'evil'; addRem(sw,'becameimp'); log(`${sw.name} (Scarlet Woman) becomes the ${R[p.role].name}. Wake them tonight to tell them.`); }
    else if(cause==='star-pass' && alive().some(q=>team(q)==='minion')){ ui.pick={kind:'starpass',actor:p.id}; return true; }
  }

  return true;
}
function ensureConsistent(){
  if(S.stage!=='game' || S.winner || ui.pick?.kind==='starpass') return;
  if(alive().some(isDemon)) return;
  const dead = S.players.find(p=>p.role==='imp' && !p.alive);
  if(dead && S.log.some(l=>l.t===`${dead.name} dies (star-pass).`) && alive().some(p=>team(p)==='minion')) ui.pick = {kind:'starpass', actor:dead.id};

function setWinner(t){ if(S.winner) return; S.winner = t; log(t); say(t);

  archiveGame(); }
function checkWin(){
  if(S.winner) return;
  const a = alive();
  if(!a.some(isDemon)){
    const et = a.find(p=>p.role==='eviltwin' && !impaired(p)), gt = a.find(p=>has(p,'twin'));
    if(et && gt){ if(!S.flags.twins){ S.flags.twins = true; log("The Demon is dead, but good can't win while both twins are alive."); } return; }
    setWinner('Good wins! The Demon is dead.');

  else if(a.length<=2) setWinner('Evil wins! Only two players are left alive.');
}
const levActive = () => S.players.some(p=>p.alive && p.role==='leviathan' && !impaired(p));
function execute(p){
  const d = S.day;
  d.executed = p.id;
  addRem(p,'executed');
  log(`${p.name} is executed.`);
  S.news = `${p.name} was executed.`;
  say(`${p.name} has been executed.`);
  if(hasAbility(p,'saint') && !impaired(p)){ p.alive=false; setWinner('Evil wins! The Saint was executed.'); return; }
  if(has(p,'twin') && S.players.some(q=>q.alive && q.role==='eviltwin' && !impaired(q))){ setWinner('Evil wins! The good twin was executed.'); }
  if(p.role==='goblin' && has(p,'claimed') && !impaired(p)) setWinner('Evil wins! The Goblin claimed and was executed.');
  if(!isEvil(p) && levActive()){ S.goodExecs = (S.goodExecs||0)+1; log(`Good players executed while the Leviathan lives: ${S.goodExecs}.`); if(S.goodExecs>1) setWinner('Evil wins! More than 1 good player was executed (Leviathan).'); }

    else { dropRem('cannibalpoison'); log(`${can.name} (Cannibal) now has the ${R[p.role].name} ability.`); }
  }
}

function purge(kind){

const timer = {left:0, end:0, running:false};
let actx = null;
const fmt = ms => { const s = Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const timerLeft = () => timer.running ? timer.end-Date.now() : timer.left;
const timerOn = () => timer.running || timer.left>0;
function suggestedMin(){ const a = alive().length; return S.phase.n===1 ? Math.min(8,Math.max(3,Math.ceil(a/2))) : Math.max(2,Math.ceil(a/3)); }
function beep(){
  try{ if(!actx) return; actx.resume();
    [0,.4,.8].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.25,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.3); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.32); });
  }catch(e){}
}
setInterval(()=>{
  if(!timer.running) return;
  const l = timerLeft();
  document.querySelectorAll('[data-timer]').forEach(e=>{ e.textContent = fmt(l); e.classList.toggle('low', l<30000); });
  if(l<=60000 && l>59000 && !timer.warned){ timer.warned = true; say('One minute left.'); }
  if(l<=0){ timer.running=false; timer.left=0; beep(); say('Time is up.'); ui.msg='Time is up. Open nominations, or move on to the night.'; render(); }
},250);
function timerHTML(){
  const l = timerLeft(), sug = suggestedMin();
  const btns = timerOn()
    ? `<button class="btn small" data-act="timertoggle">${timer.running?'Pause':'Resume'}</button><button class="btn small" data-act="timeradd">+1 min</button><button class="btn small" data-act="timershow">Show the table</button><button class="btn small" data-act="timerreset">Stop</button>`
    : [sug,...[2,3,5].filter(x=>x!==sug)].map((m,i)=>`<button class="btn small ${i?'':'primary'}" data-act="timerset" data-m="${m}">${i?m+' min':'Start '+m+' min'}</button>`).join('');
  return `<div class="timerbox"><span class="timer ${timerOn()&&l<30000?'low':''}" data-timer>${timerOn()?fmt(l):sug+':00'}</span><div class="row">${btns}</div></div>`;
}

function actorsFor(k){
  const ps = S.players;
  if(k==='minioninfo') return ps.filter(p=>team(p)==='minion' && p.role!=='marionette');
  if(k==='demoninfo') return ps.filter(isDemon);
  if(k==='newimp') return ps.filter(p=>has(p,'becameimp'));
  if(k==='king' && S.phase.n===1) return ps.some(p=>wake(p)==='king') ? ps.filter(isDemon) : [];
  if(k==='marionette') return ps.some(p=>p.role==='marionette') ? ps.filter(isDemon) : [];
  if(k==='barber') return ps.some(p=>p.role==='barber') ? ps.filter(isDemon) : [];
  if(k==='leviathan' || k==='legion') return ps.filter(p=>p.role===k);
  if(k==='lunatic' || k==='alchemist') return ps.filter(p=>p.role===k);
  return ps.filter(p=>(wake(p)===k || hasAbility(p,k)) && p.role!=='lunatic');
}
function steps(){
  const order = S.phase.n===1 ? FIRST : OTHER, out = [];
  for(const k of order){
    const st = stepDef(k); if(!st) continue;
    if((k==='minioninfo'||k==='demoninfo') && !evilInfo()) continue;
    const actors = actorsFor(k);
    if(!actors.length) continue;
    let skip = null;
    if(!st.deadOk && !['minioninfo','demoninfo'].includes(k) && actors.every(p=>!p.alive && !has(p,'undead'))) skip = 'Dead';
    if(!skip && st.need) skip = st.need(actors[0], actors);
    if(!skip && KILLERS.concat(['pukka','alhadikhia']).includes(k)){
      if(S.night?.exo && actors.some(p=>p.id===S.night.exo)) skip = 'The Exorcist chose them';
      else if(S.night?.lyc && k!=='pukka') skip = 'The Lycanthrope killed tonight';
    }
    out.push({k,actors,skip});
  }
  return out;
}
function currentStep(list){ return list.find(s=>!s.skip && !S.done[s.k]); }
const stepActor = s => s.actors.find(p=>p.alive || has(p,'diedtonight') || has(p,'undead')) || s.actors[0];

function neighbours(p){
  const n=S.players.length, i=S.players.indexOf(p), res=[];
  for(const dir of [-1,1]) for(let j=1;j<n;j++){ const q=S.players[((i+dir*j)%n+n)%n]; if(q===p) break; if(q.alive){res.push(q);break;} }
  return [...new Set(res)];
}
function truthFor(k,a){
  const ps = S.players;
  switch(k){
    case 'chef': { let c=0; ps.forEach((p,i)=>{ if(regEvil(p)&&regEvil(ps[(i+1)%ps.length])) c++; }); return c; }
    case 'empath': return neighbours(a).filter(regEvil).length;
    case 'oracle': return ps.filter(p=>!p.alive && regEvil(p)).length;
    case 'clockmaker': { const n = ps.length, ds = ps.filter(isDemon), ms = ps.filter(p=>team(p)==='minion'); let best = 0;
      ds.forEach(d=>ms.forEach(m=>{ const x = Math.abs(ps.indexOf(d)-ps.indexOf(m)), s = Math.min(x, n-x); if(!best || s<best) best = s; })); return best; }
    case 'chambermaid': { const ch = (S.pickedIds?.chambermaid||[]).map(P).filter(Boolean); const woke = steps().filter(s=>!s.skip && s.k!=='chambermaid' && STEP[s.k] && !['minioninfo','demoninfo','king','marionette','barber'].includes(s.k));
      return ch.filter(p=>woke.some(s=>s.actors.includes(p))).length; }
    case 'mathematician': return S.players.filter(p=>p.alive && impaired(p) && steps().some(s=>!s.skip && s.actors.includes(p))).length;
  }
  return 0;
}
function formFor(k,a){
  if(ui.form[k]) return ui.form[k];
  const st = stepDef(k), f = {};
  if(st.info==='pair'){
    const cands = S.players.filter(p=>p!==a && team(p)===st.team);
    if(cands.length){ const t=rnd(cands); f.role=t.role; f.a=t.id; f.b=rnd(S.players.filter(p=>p!==a&&p!==t)).id; }
    else { f.zero = true; f.role=pool(st.team)[0]||Object.keys(R).find(x=>R[x].team===st.team); f.a=S.players.find(p=>p!==a).id; f.b=S.players.find(p=>p!==a&&p.id!==f.a).id; }
  }
  if(st.info==='number') f.n = truthFor(k,a);
  if(k==='undertaker'){ const ex=P(S.executedLast||''); f.role = ex ? ex.role : pool('demon')[0]; }
  if(k==='ravenkeeper') f.role = null;
  if(st.pool==='inplaytf'){ const c = S.players.filter(p=>p!==a && team(p)==='townsfolk'); f.role = c.length ? rnd(c).role : pool('townsfolk')[0]; }
  if(st.pool==='living'){ const c = alive().filter(p=>p!==a); f.role = c.length ? rnd(c).role : null; }
  if(st.pool==='notinplay'){ const c = scriptRoles().filter(x=>!inPlay(x)); f.role = rnd(c) || pool('townsfolk')[0]; }
  if(st.info==='player'){
    if(k==='balloonist'){ const last = S.flags?.balloon; const c = S.players.filter(p=>p!==a && team(p)!==last); f.p = (rnd(c)||rnd(S.players)).id; }
    else { const c = S.players.filter(p=>p!==a && isEvil(p) && p.alive && !has(p,'bhknow')); f.p = (rnd(c)||S.players.find(p=>p!==a)).id; }
  }
  if(st.info==='pair2'){ const d = S.players.find(isDemon) || S.players[0]; f.a = d.id; f.b = (rnd(S.players.filter(p=>p!==d && p!==a))||d).id; }
  if(st.info==='yesno'){
    if(k==='towncrier') f.ans = S.lastDay?.minionNominated ? 'Yes' : 'No';
  }
  return ui.form[k] = f;
}

/* ---------- Savant statements ---------- */
function savantPair(sv){
  const ps = S.players.filter(p=>p!==sv), liv = alive(), dem = S.players.filter(isDemon), pick = (a,n) => shuffle(a).slice(0,n);
  const plus = n => n>0 && Math.random()<.5 ? n-1 : n+1;
  const pl = n => n===1 ? '' : 's';
  const gens = [
    t=>{ const p = rnd(ps); const ev = isEvil(p); return `${p.name} is ${ev===t?'evil':'good'}.`; },
    t=>{ const n = liv.filter(isEvil).length, v = t ? n : plus(n); return `There ${v===1?'is':'are'} ${v} evil player${pl(v)} alive.`; },
    t=>{ const n = S.players.filter(p=>team(p)==='outsider').length, v = t ? n : plus(n); return `There ${v===1?'is':'are'} ${v} Outsider${pl(v)} in play.`; },
    t=>{ const good = ps.filter(p=>!isDemon(p)); if(good.length<3 || !dem.length) return null; const g = t ? shuffle([rnd(dem.filter(d=>d!==sv))||dem[0], ...pick(good,2)]) : pick(good,3); return `The Demon is one of ${g[0].name}, ${g[1].name} or ${g[2].name}.`; },
    t=>{ const [a,b] = pick(ps,2); if(!b) return null; const same = isEvil(a)===isEvil(b); return `${a.name} and ${b.name} are on ${same===t?'the same team':'different teams'}.`; },
    t=>{ const inp = [...new Set(S.players.filter(p=>p!==sv).map(p=>p.role))], out = scriptRoles().filter(k=>!inPlay(k)); const k = t ? rnd(inp) : rnd(out); return k ? `The ${R[k].name} is in play.` : null; },
    t=>{ const d = dem[0]; if(!d) return null; const n = S.players.length, i = S.players.indexOf(d); const nb = [S.players[(i+1)%n], S.players[(i-1+n)%n]].some(p=>team(p)==='minion'); return `The Demon ${nb===t?'is':'is not'} sitting next to a Minion.`; },
    t=>{ const n = S.players.filter(p=>p.alive && impaired(p)).length, v = t ? n : plus(n); return `${v} living player${pl(v)} ${v===1?'is':'are'} drunk or poisoned right now.`; },
    t=>{ const p = rnd(ps), tm = team(p), other = rnd(Object.keys(TEAMS).filter(x=>x!==tm)); const lbl = {townsfolk:'a Townsfolk',outsider:'an Outsider',minion:'a Minion',demon:'the Demon'}; return `${p.name} is ${lbl[t?tm:other]}.`; }
  ];
  const vortox = S.players.some(p=>p.alive && p.role==='vortox' && !impaired(p)) && !impaired(sv);
  const make = want => { for(let i=0;i<20;i++){ const g = rnd(gens), v = g(want); if(v) return {g, v}; } return {g:null, v:want?'The Storyteller is telling the truth.':'Nobody has died yet.'}; };
  const a = make(!vortox); let b;
  for(let i=0;i<20;i++){ b = make(false); if(b.g!==a.g) break; }
  const items = shuffle([{text:a.v, truth:!vortox}, {text:b.v, truth:false}]);
  return {id:sv.id, items, vortox, impaired:impaired(sv)};
}

/* ---------- player-facing screens ---------- */
function cardYouAre(p){
  const r = seen(p), evil = p.role==='lunatic' || (p.role!=='marionette' && p.role!=='drunk' && isEvil(p));
  return {eyebrow:`${p.name}, you are the`, big:R[r].name, sub:R[r].ability, foot:evil?'You are evil':'You are good', tone:evil?'evil':'good', reveal:p.id, icon:r};
}
function passCard(p){ return {eyebrow:'Turn the screen to', big:p.name, sub:'Only look once it is facing you. Click to see your character.', passTo:p.id}; }
function cardFor(k){
  const ps = S.players, st = stepDef(k), f = ui.form[k] || {};
  const minions = ps.filter(p=>team(p)==='minion' && p.role!=='marionette'), demons = ps.filter(isDemon);
  switch(k){
    case 'minioninfo': return {eyebrow:'You are evil. The Demon is', list:demons.map(p=>p.name), sub:`Minions: ${minions.map(p=>p.name).join(', ')}`, tone:'evil'};
    case 'demoninfo': {
      const legion = demons.length>1 && demons.every(p=>p.role==='legion');
      return {eyebrow: legion ? 'You are Legion. Legion players are' : minions.length ? 'You are the Demon. Your Minions are' : 'You are the Demon', list:(legion?demons:minions).map(p=>p.name), bluffs:S.bluffs, tone:'evil'};
    }
    case 'newimp': { const p=ps.find(q=>has(q,'becameimp')); return p ? cardYouAre(p) : null; }
  }
  if(st.info==='pair'){
    if(f.zero && k==='librarian') return {eyebrow:'Outsiders in play', big:'0'};
    return {eyebrow:'One of these players is the', icon:f.role, big:R[f.role].name, list:shuffle([P(f.a).name,P(f.b).name])};
  }
  if(st.info==='number') return {eyebrow:st.label, big:String(f.n??0)};
  if(st.info==='character') return {eyebrow:st.label, icon:f.role, big:f.role?R[f.role].name:'?'};
  if(st.info==='player') return {eyebrow:st.label, big:P(f.p)?.name||'?'};
  if(st.info==='pair2') return {eyebrow:st.label, list:shuffle([P(f.a)?.name, P(f.b)?.name])};
  if(st.info==='dream') return {eyebrow:'One of these is their character', icons:[f.g,f.e], list:[R[f.g]?.name||'?', R[f.e]?.name||'?']};
}

/* ---------- picks ---------- */
const PICK_TEXT = {
  mayor:'The Demon chose the Mayor. Click the Mayor to let them die, or click anyone else to die instead.',
  redherring:"Click a good player to be the Fortune Teller's red herring.",
  fauxpaw:"Click a good player to be the Lycanthrope's faux paw (registers as evil).",
  twin:"Click a good player to be the Evil Twin's twin.",
  eviltf:'Click the Townsfolk who is evil (Bounty Hunter).',
  starpass:'The Imp killed themself. Click the living Minion who becomes the new Imp.',
  slayer:'Click the player the Slayer shoots.',
  psychopath:'Click the player the Psychopath kills.',
  klutz:'The Klutz learns they died. Click the living player they choose.',
  moonchild:'The Moonchild learns they died. Click the living player they choose.',
  innkeeperdrunk:'Click which of the two is drunk tonight.',
  widowknow:'Click the good player who learns a Widow is in play.',
  execute:'Click the player being executed.',
  execfail:'Click the player whose execution fails.',
  nominator:'Who is nominating? Click them.',
  nominee:'Who are they nominating? Click them.'
};
function pickText(pk){
  if(PICK_TEXT[pk.kind]) return PICK_TEXT[pk.kind];
  const st = stepDef(pk.kind), n = st?.n||1, got = pk.chosen?.length||0, a = P(pk.actor);
  const who = pk.kind==='legion' ? 'Click the player who dies.' : `the ${a ? (pk.kind==='barber' ? 'Demon' : R[abilityOf(a)]?.name || 'player') : 'player'} points at.`;
  if(pk.kind==='legion') return who;
  return n>1 ? `${got ? `${got} picked. ` : ''}Click player ${got+1} of ${n} ${who}` : `Click the player ${who}`;
}
function resolvePick(t){
  const pk = ui.pick, a = P(pk.actor), st = STEP[pk.kind] ? stepDef(pk.kind) : null;
  const err = m => { ui.msg = m; render(); };
  const rule = st?.rule || {};
  if(rule.notSelf && t===a) return err('They have to choose someone other than themself.');
  if(rule.alive && (!t.alive || t.fake)) return err(`${t.name} is dead. They must choose a living player.`);
  if(rule.dead && t.alive) return err(`${t.name} is alive. They must choose a dead player.`);
  if((rule.good || ['redherring','fauxpaw','twin','widowknow'].includes(pk.kind)) && isEvil(t)) return err('That has to be a good player.');
  if(pk.kind==='eviltf' && team(t)!=='townsfolk') return err('Click a Townsfolk.');
  if(pk.kind==='starpass' && (!t.alive || team(t)!=='minion')) return err('Click a living Minion.');
  if(['klutz','moonchild','psychopath'].includes(pk.kind) && !t.alive) return err('Click a living player.');
  if(pk.among && !pk.among.includes(t.id)) return err('Click one of the players they chose.');
  if(pk.kind==='exorcist' && has(t,'exorcised')) return err("The Exorcist can't choose the same player as last night.");
  if(pk.kind==='barber' && isDemon(t)) return err("The Barber swap can't include a Demon.");
  if(pk.kind==='execute') return commit(()=>{ ui.pick = null; execute(t); ui.show = {eyebrow:'The town has spoken', big:`${t.name} is executed`, tone:'evil'}; });
  if(pk.kind==='execfail') return commit(()=>{ ui.pick = null; S.day.executed = t.id; addRem(t,'executed'); S.news = `${t.name} was executed, but nothing happened.`; log(`${t.name} is executed, but only evil players voted, so the execution fails (Legion). Nobody dies.`); });
  if(pk.kind==='nominator'){
    if(!t.alive || t.fake) return err(`${t.name} is dead. Dead players can't nominate.`);
    const max = has(t,'banshee') ? 2 : 1;
    if(S.day.noms.filter(x=>x.nominator===t.id).length>=max) return err(`${t.name} already nominated today.`);
    ui.pick={kind:'nominee',actor:t.id}; return render();
  }
  if(pk.kind==='nominee'){
    if(S.day.noms.some(x=>x.nominee===t.id)) return err(`${t.name} was already nominated today.`);
    return nominate(a,t);
  }
  const n = st?.n || 1;
  if(n>1){
    const ch = pk.chosen || [];
    if(ch.includes(t.id)) return err('Click a different player.');
    if(ch.length+1<n){ ui.pick = {...pk, chosen:[...ch,t.id]}; return render(); }
    const ts = [...ch.map(P), t];
    return commit(()=>{ ui.pick = null; act(pk.kind, a, ts, pk); record(pk.kind, ts); });
  }
  commit(()=>{ ui.pick = null; act(pk.kind, a, [t], pk); record(pk.kind, [t]); });
}
function record(kind, ts){
  if(S.phase.kind==='night' && (STEP[kind]?.pick || STEP[kind+'@1']?.pick)){
    (S.picked ||= {})[kind] = ts.map(q=>q.name).join(' and ');
    (S.pickedIds ||= {})[kind] = ts.map(q=>q.id);
  }
}
function changed(p, k){ (S.night.changed ||= []).push({id:p.id, step:k}); if(p.fake && p.role!=='zombuul'){ p.fake = false; p.alive = false; log(`${p.name} only seemed dead as the Zombuul, so now they are really dead.`); } }
function safeFrom(t, demon){
  if(has(t,'innsafe')) return 'is safe (Innkeeper)';
  if(demon && has(t,'safe')) return 'is protected by the Monk';
  if(demon && abilityOf(t)==='soldier' && !impaired(t)) return 'is the Soldier';
  return null;
}
function nightKill(t, cause){
  if(!t.alive) return log(`${t.name} is already dead.`), false;
  const s = safeFrom(t,false); if(s) return log(`${t.name} ${s}. Nobody dies.`), false;
  return kill(t, cause);
}
function demonHit(a, t){
  if(!t.alive) return log(`${t.name} is already dead, so nobody dies.`), false;
  const s = safeFrom(t,true); if(s) return log(`${t.name} ${s}. Nobody dies.`), false;
  if(abilityOf(t)==='mayor' && !impaired(t)){ ui.pick = {kind:'mayor',actor:a.id,target:t.id}; log('The Demon chose the Mayor. You decide who dies.'); return false; }
  const died = kill(t, `killed by the ${R[a.role].name}`);
  if(died || t.fake) addRem(t,'bydemon');
  if(died && abilityOf(t)==='banshee' && !impaired(t)){ addRem(t,'banshee'); log(`${t.name} is the Banshee: announce it at dawn.`); }
  return died;
}
function demonAttack(a, t){
  const k = a.role;
  if(impaired(a)) return log(`The ${R[k].name} is drunk or poisoned, so nobody dies.`);
  if(S.night.lyc) return log('The Lycanthrope already killed tonight, so the Demon kills nobody.');
  if(k==='imp' && t===a){ S.done.imp = true; return kill(a,'star-pass'); }
  if(k==='fanggu' && team(t)==='outsider' && t.alive && !S.flags.fang && !safeFrom(t,true)){
    S.flags.fang = true; const old = a; t.role='fanggu'; t.as=null; t.align='evil'; changed(t,'fanggu');
    log(`${t.name} is an Outsider, so they become the evil Fang Gu and ${old.name} dies instead.`);
    return kill(old,'Fang Gu jumped');
  }
  if(k==='vigormortis' && team(t)==='minion' && t.alive && !safeFrom(t,true)){
    addRem(t,'undead');
    const tn = rnd(townNeighbours(t)); if(tn){ addRem(tn,'vigorpoison'); log(`${t.name} keeps their Minion ability, and their Townsfolk neighbour ${tn.name} is poisoned.`); }
  }
  demonHit(a,t);
}
function act(kind, a, ts, pk){
  const [t, u, w] = ts, sob = a ? !impaired(a) : true;
  switch(kind){
    case 'poisoner': dropRem('poisoned'); addRem(t,'poisoned'); log(`Poisoner ${a.name} poisoned ${t.name} (until tomorrow's dusk).`); break;
    case 'monk':
      if(!sob){ addRem(t,'safe',{label:'Safe (no effect)',off:true}); log(`Monk ${a.name} picked ${t.name}, but the Monk is ${why(a).toLowerCase().replace('this is ','')}, so it does nothing.`); }
      else { addRem(t,'safe'); log(`Monk ${a.name} protected ${t.name} tonight.`); }
      break;
    case 'butler': dropRem('master'); addRem(t,'master'); log(`Butler ${a.name} chose ${t.name} as their master.`); break;
    case 'fortuneteller': {
      const hit = [t,u].filter(q=>isDemon(q) || has(q,'redherring')), ans = hit.length ? 'Yes' : 'No';
      (ui.form.fortuneteller ||= {}).ans = ans;
      const whyT = hit.length ? ` (${hit.map(q=>isDemon(q)?`${q.name} is the Demon`:`${q.name} is the red herring`).join(', ')})` : '';
      log(`Fortune Teller ${a.name} picked ${t.name} and ${u.name}. True answer: ${ans}${whyT}.${!sob?' They are drunk or poisoned, so you may say anything.':''}${[t,u].some(q=>q.role==='recluse')?' A Recluse was picked, so you may say Yes.':''}`);
      break; }
    case 'ravenkeeper': (ui.form.ravenkeeper ||= {}).role = t.role; log(`Ravenkeeper ${a.name} picked ${t.name} (${roleLabel(t)}).`); break;
    case 'redherring': dropRem('redherring'); addRem(t,'redherring'); log(`${t.name} is the red herring.`); break;
    case 'fauxpaw': dropRem('fauxpaw'); addRem(t,'fauxpaw'); log(`${t.name} is the faux paw.`); break;
    case 'twin': dropRem('twin'); addRem(t,'twin'); log(`${t.name} is the good twin.`); break;
    case 'eviltf': S.players.forEach(q=>{ if(has(q,'eviltf')) q.align=null; }); dropRem('eviltf'); t.align='evil'; addRem(t,'eviltf'); log(`${t.name} is the evil Townsfolk.`); break;
    case 'starpass':
      if(t.role==='poisoner' && S.players.some(q=>has(q,'poisoned'))){ dropRem('poisoned'); log('The Poisoner is now the Imp, so their poison ends.'); }
      t.role='imp'; t.as=null; t.align='evil'; addRem(t,'becameimp'); log(`${t.name} becomes the Imp.`); checkWin(); break;
    case 'mayor': kill(t, t.id===pk.target ? 'killed by the Demon' : 'killed instead of the Mayor'); break;
    case 'slayer':
      addRem(a,'noability');
      if(isDemon(t) && sob) kill(t,'shot by the Slayer');
      else log(`The Slayer shoots ${t.name}. Nothing happens.${t.role==='recluse'?' (They are the Recluse: you may decide they die.)':''}`);
      break;
    case 'psychopath': S.day.psycho = true; log(`Psychopath ${a.name} chooses ${t.name}.`); if(sob) kill(t,'killed by the Psychopath'); break;
    case 'klutz': log(`Klutz ${a.name} chooses ${t.name}.`); if(isEvil(t)) setWinner(`Evil wins! The Klutz chose ${t.name}, who is evil.`); else log(`${t.name} is good, so nothing happens.`); break;
    case 'moonchild': dropRem('moon'); addRem(t,'moon',{expires:'never'}); log(`Moonchild ${a.name} chooses ${t.name}. Tonight, if they are good, they die.`); break;
    case 'imp': case 'fanggu': case 'nodashii': case 'vortox': case 'vigormortis': case 'zombuul':
      log(`${R[a.role].name} ${a.name} chose ${t===a?'themself':t.name}.`); demonAttack(a,t); break;
    case 'legion': log(`Legion: ${t.name} is chosen to die.`); if(S.night.lyc) log('The Lycanthrope already killed tonight, so nobody dies.'); else demonHit(a,t); break;
    case 'pukka': {
      const prev = S.players.find(q=>has(q,'pukka'));
      const sobP = !(['drunk','marionette'].includes(a.role) || a.rem.some(r=>!r.off && REM[r.type]?.bad && r.type!=='pukka') || ndPoisoned(a));
      if(!sobP){ log(`Pukka ${a.name} chose ${t.name}, but the Pukka is drunk or poisoned: nobody new is poisoned, and nobody dies.`); break; }
      if(prev && prev!==t){ prev.rem = prev.rem.filter(r=>r.type!=='pukka');
        if(S.night.lyc) log(`${prev.name} was poisoned by the Pukka, but the Lycanthrope killed tonight, so they live and are healthy.`);
        else if(S.phase.n>1){ log(`${prev.name} was poisoned by the Pukka last night.`); demonHit(a,prev); } }
      if(!a.alive){ log(`The Pukka died, so ${t.name} is not poisoned.`); break; }
      addRem(t,'pukka'); log(`Pukka ${a.name} poisoned ${t.name}. They die tomorrow night.`);
      break; }
    case 'lunatic': log(`Lunatic ${a.name} chose ${t.name}. Nothing happens. Show the Demon.`); break;
    case 'widow':
      dropRem('widowpoison'); if(sob) addRem(t,'widowpoison');
      log(`Widow ${a.name} poisoned ${t.name}${sob?'':' (no effect: the Widow is drunk or poisoned)'}.`);
      ui.pick = {kind:'widowknow', actor:a.id}; break;
    case 'widowknow': dropRem('know'); addRem(t,'know'); log(`${t.name} learns a Widow is in play.`); break;
    case 'snakecharmer':
      if(isDemon(t) && sob){
        const dk = t.role; t.role='snakecharmer'; t.as=null; t.align='good'; addRem(t,'snakepoison');
        a.role = dk; a.as = null; a.align = 'evil'; changed(a,'snakecharmer'); changed(t,'snakecharmer');
        log(`Snake Charmer ${a.name} chose the Demon! ${a.name} is now the evil ${R[dk].name}. ${t.name} is now the good Snake Charmer, and poisoned.`);
      } else log(`Snake Charmer ${a.name} chose ${t.name}. ${isDemon(t)?'The Snake Charmer is drunk or poisoned, so nothing happens.':'Not the Demon: nothing happens.'}`);
      break;
    case 'godfather': log(`Godfather ${a.name} chose ${t.name}.`); if(sob) nightKill(t,'killed by the Godfather'); else log('The Godfather is drunk or poisoned, so nobody dies.'); break;
    case 'witch': dropRem('cursed'); if(sob) addRem(t,'cursed'); log(`Witch ${a.name} cursed ${t.name}${sob?': if they nominate tomorrow, they die':' (no effect: drunk or poisoned)'}.`); break;
    case 'cerenovus': { const k = ui.form.cerenovus?.role || pool('townsfolk')[0]; dropRem('cmad'); addRem(t,'cmad',{label:`Mad: ${R[k].name}`, k, off:!sob}); log(`Cerenovus ${a.name} chose ${t.name}: mad about being the ${R[k].name} tomorrow.${sob?'':' (No effect: drunk or poisoned. Show them anyway.)'}`); break; }
    case 'harpy': dropRem('hmad'); dropRem('hsecond'); addRem(t,'hmad',{label:`Mad: ${u.name} is evil`, off:!sob}); addRem(u,'hsecond',{off:!sob}); log(`Harpy ${a.name} chose ${t.name} and ${u.name}: ${t.name} must be mad that ${u.name} is evil.`); break;
    case 'dreamer': {
      const ev = isEvil(t), g = ev ? rnd(pool('townsfolk').concat(pool('outsider')).filter(k=>k!==t.role)) : seen(t), e = ev ? t.role : rnd(pool('minion').concat(pool('demon')));
      ui.form.dreamer = {g: g || 'washerwoman', e: e || 'imp'}; log(`Dreamer ${a.name} picked ${t.name} (${roleLabel(t)}).${sob?'':' They are drunk or poisoned, so both may be wrong.'}`); break; }
    case 'seamstress': { addRem(a,'noability'); const ans = regEvil(t)===regEvil(u) ? 'Yes' : 'No'; (ui.form.seamstress ||= {}).ans = ans; log(`Seamstress ${a.name} picked ${t.name} and ${u.name}. True answer: ${ans}.`); break; }
    case 'ogre': a.align = isEvil(t) ? 'evil' : 'good'; log(`Ogre ${a.name} chose ${t.name}, so the Ogre is now ${a.align}. They don't know this.`); break;
    case 'chambermaid': log(`Chambermaid ${a.name} picked ${t.name} and ${u.name}.`); ui.form.chambermaid = {n: truthFor('chambermaid', a)}; break;
    case 'innkeeper':
      if(!sob){ log(`Innkeeper ${a.name} picked ${t.name} and ${u.name}, but is drunk or poisoned: no effect.`); break; }
      addRem(t,'innsafe'); addRem(u,'innsafe'); log(`Innkeeper ${a.name} picked ${t.name} and ${u.name}. Neither can die tonight.`);
      ui.pick = {kind:'innkeeperdrunk', actor:a.id, among:[t.id,u.id]}; break;
    case 'innkeeperdrunk': addRem(t,'drunk',{label:'Drunk (Innkeeper)',expires:'dusk'}); log(`${t.name} is drunk until dusk (Innkeeper).`); break;
    case 'gambler': { const k = ui.form.gambler?.role; log(`Gambler ${a.name} guessed ${t.name} is the ${R[k]?.name||'?'}.`);
      if(k && t.role!==k){ if(sob) nightKill(a,'guessed wrong'); else log('Wrong, but the Gambler is drunk or poisoned, so they live.'); } else log('Right: nothing happens.'); break; }
    case 'pithag': { const k = ui.form.pithag?.role;
      if(!k) break;
      if(inPlay(k)){ log(`Pit-Hag ${a.name} chose ${t.name} and the ${R[k].name}, who is already in play. Nothing happens.`); break; }
      if(!sob){ log(`Pit-Hag ${a.name} is drunk or poisoned, so nothing happens.`); break; }
      endAbility(t); t.align = isEvil(t) ? 'evil' : 'good'; t.role = k; t.as = null; t.shown = k==='lunatic' ? (S.players.find(isDemon)?.role || pool('demon')[0]) : ['drunk','marionette'].includes(k) ? (pool('townsfolk').find(r=>!inPlay(r)) || pool('townsfolk')[0]) : null; changed(t,'pithag');
      log(`Pit-Hag ${a.name} turned ${t.name} into the ${R[k].name}. They stay ${t.align}.${R[k].team==='demon'?' A Demon was made: deaths tonight are up to you. Use "Mark dead" on any seat.':''}`);
      checkWin(); break; }
    case 'exorcist': dropRem('exorcised'); addRem(t,'exorcised'); S.night.exo = isDemon(t) && sob ? t.id : null; log(`Exorcist ${a.name} chose ${t.name}.${S.night.exo?' It is the Demon: they learn who the Exorcist is and do not wake tonight.':''}`); break;
    case 'lycanthrope':
      log(`Lycanthrope ${a.name} chose ${t.name}.`);
      if(!sob) log('The Lycanthrope is drunk or poisoned, so nothing happens.');
      else if(regEvil(t)) log(`${t.name} registers as evil, so nothing happens.`);
      else if(nightKill(t,'killed by the Lycanthrope')) S.night.lyc = true;
      break;
    case 'alhadikhia': log(`Al-Hadikhia ${a.name} chose ${ts.map(q=>q.name).join(', ')}. Announce these names, then ask each in turn.`); ui.form.alhadikhia = {ids:ts.map(q=>q.id), live:{}}; break;
    case 'assassin': addRem(a,'noability'); log(`Assassin ${a.name} chose ${t.name}.`); if(sob) kill(t,'killed by the Assassin'); else log('The Assassin is drunk or poisoned, so nothing happens.'); break;
    case 'barber': {
      if(!sob) { log('The Demon is drunk or poisoned, so nothing swaps.'); break; }
      const keep = q => q.align || (isEvil(q) ? 'evil' : 'good');
      const ta = keep(t), ua = keep(u);
      endAbility(t); endAbility(u);
      [t.role,u.role] = [u.role,t.role]; [t.shown,u.shown] = [u.shown,t.shown]; t.as = null; u.as = null; t.align = ta; u.align = ua;
      changed(t,'barber'); changed(u,'barber'); S.haircut = null;
      log(`Barber: ${t.name} is now the ${R[t.role].name} and ${u.name} is now the ${R[u.role].name}. Their teams stay the same.`); break; }
    case 'sweetheart': (S.flags ||= {}).sweet = true; addRem(t,'drunk',{label:'Drunk (Sweetheart)'}); log(`${t.name} is drunk for the rest of the game (Sweetheart).`); break;
    case 'professor': addRem(a,'noability');
      if(sob && team(t)==='townsfolk'){ t.alive = true; t.ghost = true; t.rem = t.rem.filter(r=>r.type!=='diedtonight'); log(`Professor ${a.name} brings ${t.name} back to life.`); }
      else log(`Professor ${a.name} chose ${t.name}. ${team(t)!=='townsfolk'?'Not a Townsfolk':'Drunk or poisoned'}: nothing happens.`); break;
    case 'farmer': t.align = 'good'; t.role = 'farmer'; t.as = null; changed(t,'farmer'); log(`${t.name} becomes a Farmer.`); break;
  }
}

/* ---------- day: nominations & voting ---------- */
function nominate(nr,ne){
  const d = S.day;
  commit(()=>{
    ui.pick = null;
    d.noms.push({nominator:nr.id, nominee:ne.id});
    if(team(nr)==='minion') d.minionNominated = true;
    log(`${nr.name} nominates ${ne.name}.`);
    if(abilityOf(nr)==='golem' && !has(nr,'noability')){ addRem(nr,'noability'); if(!impaired(nr) && !isDemon(ne)) kill(ne,'killed by the Golem'); else log(`The Golem nominated ${ne.name}. ${isDemon(ne)?'They are the Demon, so':'The Golem is drunk or poisoned, so'} nothing happens.`); }
    if(has(nr,'cursed') && sober('witch') && alive().length>3) kill(nr,'cursed by the Witch for nominating');
    if(wake(ne)==='virgin' && !has(ne,'noability')){
      addRem(ne,'noability');
      if(!impaired(ne) && team(nr)==='townsfolk' && nr.alive){
        log(`${nr.name} nominated the Virgin and is a Townsfolk, so they are executed right away.`);
        execute(nr);
        ui.show = {eyebrow:'The Virgin was nominated', big:`${nr.name} is executed`, tone:'evil'};
      } else log(`${nr.name} nominated the Virgin. Nothing happens.${nr.role==='spy'?' (Spy: you may treat them as a Townsfolk.)':''}`);
    }
  });
}
/* ---------- rendering ---------- */
function seatHTML(p,i,n){
  const ang = -Math.PI/2 + i*2*Math.PI/n, r = 41;
  const x = 50 + r*Math.cos(ang), y = 50 + r*Math.sin(ang);
  const marks = [];
  if(S.stage==='game' || S.stage==='seats' || S.stage==='reveal'){
    if(THINKS.includes(p.role)) marks.push(`<span class="chip ${p.role==='drunk'?'drunk':'evil'}">${R[p.role].name}</span>`);
    if(p.as && p.as!==p.role && !THINKS.includes(p.role)) marks.push(`<span class="chip info">as ${esc(R[p.as]?.name||'?')}</span>`);
    if(alignNote(p)) marks.push(`<span class="chip ${isEvil(p)?'evil':'good'}">${isEvil(p)?'Evil':'Good'}</span>`);
    if(S.stage==='game' && ndPoisoned(p)) marks.push('<span class="chip poison">Poisoned (No Dashii)</span>');
    p.rem.forEach(m=>marks.push(`<span class="chip ${m.cls}${m.off?' off':''}" title="${esc(m.label)} · ${EXP[m.expires]}">${esc(m.label.replace(/ \(.*\)/,''))}</span>`));
  }
  const list = S.stage==='game' && S.phase.kind==='night' ? steps() : [];
  const cur = currentStep(list);
  const waking = cur && cur.actors.includes(p) && !ui.pick;
  const cls = ['seat', p.role?team(p):'blank', p.alive&&!p.fake?'':'dead', (!p.alive||p.fake)&&p.ghost?'ghost':'', ui.sel===p.id?'sel':'', ui.pick?'pickable':'', waking?'waking':'', ui.pick?.chosen?.includes(p.id)?'chosen':'', ui.pop===p.id?'sel':''].join(' ');
  const tokKey = !p.role ? null : seen(p);
  const tip = `${p.name}${p.role?' · '+roleLabel(p):''}${p.rem.length?' · '+p.rem.map(r=>r.label).join(', '):''}. Click for details, right-click for quick actions, drag to move seats.`;
  return `<div role="button" tabindex="0" draggable="true" class="${cls}" style="left:${x}%;top:${y}%" data-act="seat" data-id="${p.id}" aria-label="${esc(p.name)}" title="${esc(tip)}">
    <span class="tok">${tokenSVG(tokKey, i+1)}</span><span class="pname">${esc(p.name)}</span><span class="marks">${marks.join('')}</span></div>`;
}

function centerHTML(){
  if(S.stage!=='game') return `<div class="center"><div class="ph">Setup</div><div class="stat">${S.players.length} players</div></div>`;
  const a = voters().length, ph = S.phase;
  const ghosts = S.players.filter(p=>(!p.alive||p.fake)&&p.ghost).length;
  return `<div class="center"><div class="ph">${ph.kind==='night'?'Night':'Day'} ${ph.n}</div>
    <div class="stat">${a} alive${ghosts?` · ${ghosts} ghost vote${ghosts>1?'s':''}`:''}</div>
    ${ph.kind==='day'?`<div class="stat"><b>${dayNeed()}</b>votes to execute</div>`:''}
    ${ph.kind==='day'&&timerOn()?`<div class="clock ${timerLeft()<30000?'low':''}" data-timer>${fmt(timerLeft())}</div>`:''}</div>`;
}
const dayNeed = needed;

function setupHTML(){
  const idx = STAGES.findIndex(s=>s[0]===S.stage);

    return head + `${S.log.length||S.stage!=='players'?'':`<div class="tip"><span>First time telling the story?</span><button class="btn small primary" data-act="tab" data-k="guide">Read the 2-minute guide</button></div>`}
      <h2>Which game?</h2>
      <div class="mode scripts">${Object.entries(SCRIPTS).map(([id,sc])=>{ const rs = id==='teensy' ? teensyList : sc.roles;

      ${S.script==='teensy'?`<p class="muted">Your list: ${teensyList.map(k=>R[k].name).join(', ')}.</p><div class="row" style="margin-bottom:12px"><button class="btn small" data-act="editteensy">Choose Teensyville characters</button></div>`:''}
      ${SCRIPTS[S.script]?.note?`<p class="muted">${esc(SCRIPTS[S.script].note)}</p>`:''}
      <div class="row" style="margin-bottom:10px"><button class="btn small" data-act="tab" data-k="script">${ic('book')}Share the ${esc(scriptName())} character sheet</button></div>
      ${fabled().map(k=>`<p class="muted"><b>${R[k].name}:</b> ${esc(R[k].ability)}</p>`).join('')}

      <p class="muted" style="margin-top:8px">${t} Townsfolk · ${o} Outsider${o===1?'':'s'} · ${m} Minion${m>1?'s':''} · ${d} Demon${n<=6?(evilInfo()?'. The Toymaker gives evil their normal info even with 5 or 6 players.':'. With 6 or fewer players, Minions and the Demon do not learn each other.'):''}</p>
      <p class="muted" style="margin:0 0 6px">You can also drag seats on the table to change the order.</p><label class="f">Names, clockwise around the table<textarea id="names" data-change="names">${esc(S.players.map(p=>p.name).join('\n'))}</textarea></label>
      <div style="margin-top:12px"><button class="btn primary big" data-act="stage" data-to="chars">Next: choose characters</button></div>`;
  }
  if(S.stage==='chars'){
    const tg = targets(), total = bagTotal(), ok = bagOK();
    const want = t => t==='outsider' && tg.oOpts.length>1 ? `${Math.min(...tg.oOpts)}–${Math.max(...tg.oOpts)}` : tg[t];
    const good = t => t==='outsider' ? tg.oOpts.includes(chosenCount(t)) : chosenCount(t)===tg[t];
    const counts = Object.keys(TEAMS).map(t=>`<div class="${good(t)?'ok':chosenCount(t)>(t==='outsider'?Math.max(...tg.oOpts):tg[t])?'bad':''}"><b>${chosenCount(t)}/${want(t)}</b>${TEAMS[t]}</div>`).join('');
    const grid = Object.keys(TEAMS).map(t=>`<h3>${TEAMS[t]}</h3><div class="chars">${pool(t).map(k=>`<button class="cbtn ${t} ${S.chosen.includes(k)?'on':''}" data-act="togglechar" data-k="${k}"><span class="mini">${tokenSVG(k)}</span><span class="ctext"><b>${R[k].name}${k==='legion'&&S.chosen.includes(k)?` ×${legionN()}`:''}</b><small>${R[k].ability}</small></span></button>`).join('')}</div>`).join('');
    const notes = [];
    if(S.chosen.includes('baron')) notes.push('Baron is in: 2 Townsfolk become 2 Outsiders.');
    if(S.chosen.includes('fanggu')) notes.push('Fang Gu is in: 1 extra Outsider.');
    if(S.chosen.includes('vigormortis')) notes.push('Vigormortis is in: 1 fewer Outsider.');
    if(S.chosen.includes('godfather')) notes.push('Godfather is in: 1 more or 1 fewer Outsider (your choice).');
    if(S.chosen.includes('balloonist')||S.chosen.includes('gatekeeper')) notes.push('You may add 1 extra Outsider.');
    if(S.chosen.includes('hermit')) notes.push('Hermit is in: you may have 1 fewer Outsider.');

    if(S.chosen.includes('legion')) notes.push(`Legion is in: ${legionN()} players are Legion and there are no Minions.`);
    if(S.chosen.includes('choirboy') && !S.chosen.includes('king')) notes.push('The Choirboy needs the King in play. Add the King.');
    if(S.chosen.includes('marionette')) notes.push('The Marionette will be seated next to the Demon and told a Townsfolk character.');
    if(S.chosen.includes('bountyhunter')) notes.push('Bounty Hunter: 1 Townsfolk will be evil. You can change who on the next step.');
    return head + `<h2>Put characters in the bag</h2>
      <div class="counts">${counts}</div>
      ${notes.map(x=>`<p class="warn">${esc(x)}</p>`).join('')}
      ${S.chosen.some(k=>THINKS.includes(k))?'<p class="muted">The Drunk, Lunatic and Marionette are told a different character. You pick it on the next step.</p>':''}
      <div class="row"><button class="btn small" data-act="fill">Fill the rest at random</button><button class="btn small" data-act="clearchars">Clear</button></div>

    if(S.players.some(p=>p.role==='eviltwin')) mark('twin','twin',"Evil Twin's good twin");
    if(S.players.some(p=>p.role==='bountyhunter')) mark('eviltf','eviltf','The evil Townsfolk (Bounty Hunter)');
    return head + `<h2>Seats are dealt</h2>
      <p class="muted">Characters were shuffled into seats like drawing from a bag. Click a seat to swap a character by hand.</p>
      <div class="row"><button class="btn small" data-act="redeal">Shuffle again</button></div>
      ${parts.join('')}
      ${evilInfo()?`<h3>Demon bluffs</h3><div class="row"><span>${S.bluffs.map(b=>R[b].name).join(', ')}</span><button class="btn small" data-act="rebluff">Re-roll</button></div>${S.bluffs.length<3?`<p class="muted">${S.bluffs.length ? `Only ${S.bluffs.length} good character${S.bluffs.length===1?' is':'s are'} left out of play on this script, so that's all the Demon can get.` : 'Every good character on this script is in play, so the Demon gets no bluffs.'}</p>`:''}`:''}
      <div style="margin-top:14px" class="row"><button class="btn" data-act="stage" data-to="chars">Back</button><button class="btn primary" style="flex:1" data-act="stage" data-to="reveal">Next: show players their characters</button></div>`;
  }
  if(S.stage==='reveal'){
    const next = S.players.find(p=>!p.revealed);

async function sheetCanvas(id = S.script){
  const keep = S.script; S.script = id;
  const name = scriptName(), by = sheetBy(), roles = scriptRoles(), fab = fabled(), counts = playerCounts(), pools = Object.fromEntries(SHEET_TEAMS.map(([t])=>[t, pool(t)]));

  const plan = SHEET_TEAMS.map(([t,l])=>({l, ks:pools[t]})).filter(sec=>sec.ks.length).map(sec=>{
    const rows = []; for(let i=0;i<sec.ks.length;i+=2){ const a = measure(sec.ks[i]), b = sec.ks[i+1] ? measure(sec.ks[i+1]) : {h:0}; rows.push({ks:[sec.ks[i], sec.ks[i+1]], ms:[a,b], h:Math.max(a.h,b.h)+24}); }
    return {...sec, rows}; });
  const rowH = 46;
  let y = M + 100; plan.forEach(sec=>{ y += 62; sec.rows.forEach(r=>y += r.h); });
  const tableY = y + 30;
  c.width = W; c.height = Math.ceil(tableY + 70 + rowH*5 + 60 + M);
  x.fillStyle = '#fffdf8'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle = '#1b1712'; x.font = `64px ${DISP}`; x.fillText(name, M, M+52);
  if(by){ const tw = x.measureText(name).width; x.font = `italic 30px ${DISP}`; x.fillStyle = '#4a4036'; x.fillText(`by ${by}`, M+tw+26, M+52); }

  const rule = (label, yy) => { x.font = `28px ${DISP}`; x.fillStyle = '#1b1712'; x.fillText(label, M, yy+26); const lw = x.measureText(label).width; x.strokeStyle = '#8b7d6b'; x.lineWidth = 2; x.beginPath(); x.moveTo(M+lw+18, yy+17); x.lineTo(W-M, yy+17); x.stroke(); };
  y = M + 100;
  plan.forEach(sec=>{
    rule(sec.l.toUpperCase(), y); y += 62;
    sec.rows.forEach(r=>{ r.ks.forEach((k,i)=>{ if(!k) return; const cx = M + i*(colW+GAP), evil = ['minion','demon'].includes(R[k].team);
        const pad = offIcon(k) && !tokenImg[k] ? 14 : 0; if(imgs[k]) x.drawImage(imgs[k], cx-pad, y-pad, IC+2*pad, IC+2*pad);
        x.fillStyle = evil ? '#9b1d18' : '#1f5f9e'; x.font = `700 30px ${BODY}`; x.fillText(R[k].name, cx+IC+18, y+28);
        x.fillStyle = '#2a241d'; x.font = `24px ${BODY}`; r.ms[i].ls.forEach((ln,j)=>x.fillText(ln, cx+IC+18, y+64+j*30)); });
      y += r.h; });
  });
  y = tableY; rule('HOW MANY OF EACH', y); y += 70;
  const labW = 230, cw = (W-2*M-labW)/counts.length;
  const trow = (label, vals, color, bold, yy) => { x.font = `${bold?'700 ':''}26px ${BODY}`; x.fillStyle = color; x.fillText(label, M, yy+31); x.textAlign = 'center'; vals.forEach((v,i)=>x.fillText(String(v), M+labW+cw*i+cw/2, yy+31)); x.textAlign = 'left'; };

    if(j%2){ x.fillStyle = '#f8f3ea'; x.fillRect(M, y, W-2*M, rowH); }
    trow(l, counts.map(n=>DIST[n][i]), col, false, y); y += rowH; });
  x.font = `italic 22px ${BODY}`; x.fillStyle = '#6b6156';
  if(badge) x.drawImage(badge, W-M-151, y+6, 151, 60);

}
function pdfFromCanvas(c){
  const bin = atob(c.toDataURL('image/jpeg', .92).split(',')[1]), img = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) img[i] = bin.charCodeAt(i);
  const pw = 595.28, ph = +(c.height*pw/c.width).toFixed(2), enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = b => { if(typeof b==='string') b = enc.encode(b); parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1, ()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, ()=>push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, ()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, ()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`); push(img); push('\nendstream'); });
  const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5, ()=>push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
  const xref = len;
  push(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out = new Uint8Array(len); let o = 0; parts.forEach(p=>{ out.set(p,o); o += p.length; }); return out;
}
