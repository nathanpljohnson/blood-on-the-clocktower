      else parts.push(`<div class="truth">True answer: <b>${ans||'?'}</b>.</div>`);
      parts.push(`<div class="row"><button class="btn ${ans==='Yes'?'primary':'good'}" data-act="showyn" data-k="${s.k}" data-v="Yes">${ic('eye')}Show YES</button><button class="btn ${ans==='No'?'primary':'good'}" data-act="showyn" data-k="${s.k}" data-v="No">${ic('eye')}Show NO</button>${s.k==='fortuneteller'?'<button class="btn small" data-act="pick" data-kind="redherring">Move red herring</button>':''}</div>`);
    }
    if(st.info==='character' && (s.k!=='ravenkeeper' || f.role)){
      const ex = s.k==='undertaker' ? P(S.executedLast||'') : null;
      if(ex) parts.push(`<div class="truth">Executed today: ${names([ex])}</div>`);
      if(st.pool==='inplaytf') parts.push(`<div class="truth">Townsfolk in play: ${names(S.players.filter(p=>p!==a && team(p)==='townsfolk'))}. That player will be marked "Pixie's character".</div>`);
      if(st.pool==='living') parts.push(`<div class="truth">Living: ${names(alive().filter(p=>p!==a))}</div>`);
      const keys = st.pool==='notinplay' ? scriptRoles().filter(k=>!inPlay(k)) : [...new Set([...scriptRoles(), ...S.players.map(p=>p.role)])];
      parts.push(`<div class="row"><label class="f">Character to show<select data-form="${s.k}" data-field="role">${charOpts(f.role, keys)}</select></label><button class="btn primary" data-act="showstep" data-k="${s.k}">${ic('eye')}Show screen</button></div>`);
    }
    if(st.info==='player'){
      parts.push(`<div class="truth">${s.k==='balloonist'?`Last shown type: <b>${esc(TEAMS[S.flags?.balloon]||'none yet')}</b>. Pick a player of a different type.`:`Evil players: ${names(S.players.filter(p=>p!==a && isEvil(p)))}`}</div>`);
      parts.push(`<div class="row"><label class="f">Player to show<select data-form="${s.k}" data-field="p">${plOpts(f.p)}</select></label><button class="btn primary" data-act="showstep" data-k="${s.k}">${ic('eye')}Show screen</button></div>`);
    }
    if(st.info==='pair2'){
      parts.push(`<div class="truth">Demon: ${names(S.players.filter(isDemon))}</div><div class="row"><label class="f">Player<select data-form="${s.k}" data-field="a">${plOpts(f.a)}</select></label><label class="f">Player<select data-form="${s.k}" data-field="b">${plOpts(f.b)}</select></label><button class="btn primary" data-act="showstep" data-k="${s.k}">${ic('eye')}Show screen</button></div>`);
    }
    if(st.info==='dream' && S.picked?.dreamer){
      const good = scriptRoles().filter(k=>['townsfolk','outsider'].includes(R[k].team)), evil = scriptRoles().filter(k=>['minion','demon'].includes(R[k].team));
      parts.push(`<div class="row"><label class="f">Good character<select data-form="dreamer" data-field="g">${charOpts(f.g, good)}</select></label><label class="f">Evil character<select data-form="dreamer" data-field="e">${charOpts(f.e, evil)}</select></label><button class="btn primary" data-act="showstep" data-k="dreamer">${ic('eye')}Show screen</button></div>`);
    }
  }
  const cards = st.cards ? st.cards(a) : [];
  const ch = (S.night?.changed||[]).filter(c=>c.step===s.k).map(c=>P(c.id)).filter(Boolean);
  if(cards.length || ch.length) parts.push(`<div class="row">${cards.map((c,i)=>`<button class="btn ${c.card.tone==='evil'?'evil':''}" data-act="showcard" data-k="${s.k}" data-i="${i}">${ic('eye')}${esc(c.label)}</button>`).join('')}${ch.map(p=>`<button class="btn ${isEvil(p)?'evil':''}" data-act="youare" data-id="${p.id}">${ic('eye')}Show ${esc(p.name)} their new character</button>`).join('')}</div>`);
  if(s.k==='spy' || s.k==='widow') parts.push(`<div class="row"><button class="btn primary" data-act="spyview">${ic('eye')}Show them the grimoire</button></div><div class="muted" style="font-size:.82rem">Shows the table like a real grimoire, without the app's notes and answers. Click anywhere to hide it.</div>`);
  parts.push(`<button class="btn big ${S.done[s.k]?'':'primary'}" data-act="done" data-k="${s.k}">${ic('check')}${S.done[s.k]?'Done':'Done, put them to sleep'}</button>`);
  return `<div class="body">${parts.join('')}</div>`;
}

const whoFlags = p => esc(p.name)+(p.role==='drunk'?' <span class="chip drunk">Drunk</span>':'')+(p.role==='marionette'?' <span class="chip evil">Marionette</span>':'')+(impaired(p)&&p.role!=='drunk'&&p.role!=='marionette'?' <span class="chip poison">Drunk or poisoned</span>':'')+(!p.alive&&!has(p,'diedtonight')?' <span class="chip muted">Dead</span>':'');
function phaseRecap(label){
  const items = S.log.filter(l=>l.at===label).reverse();
  return items.length ? `<ul class="recapl">${items.map(l=>`<li>${esc(l.t)}</li>`).join('')}</ul>` : '<p class="muted">Nothing yet.</p>';
}
function nightHTML(){
  const list = steps(), cur = currentStep(list);
  const active = list.filter(s=>!s.skip), doneN = active.filter(s=>S.done[s.k]).length;
  const focus = list.find(s=>s.k===ui.open && !s.skip) || cur;
  const rows = list.map((s,i)=>{
    const title = stepTitle(s.k), done = S.done[s.k];
    return `<li class="step ${s===cur?'cur':''} ${done?'done':''} ${s.skip?'skip':''}">
      <button class="head" data-act="openstep" data-k="${s.k}" ${s.skip?'disabled':''}><span class="num">${done?'✓':i+1}</span><span class="t">${esc(title)}</span><span class="who">${s.skip?esc(s.skip):s.actors.map(p=>esc(p.name)).join(', ')}</span></button></li>`;
  }).join('');
  const card = focus ? `<div class="focus">
      <div class="eyebrow">Step ${active.indexOf(focus)+1} of ${active.length}${focus!==cur?' · going back to an earlier step':''}</div>
      <div class="ftitle">${esc(stepTitle(focus.k))}</div>
      <div class="wakewho">Wake ${focus.actors.map(whoFlags).join(', ')}</div>
      ${stepBody(focus)}
      ${focus!==cur&&cur?`<button class="btn small" data-act="openstep" data-k="${cur.k}">${ic('back')}Back to the current step</button>`:''}
    </div>`
    : `<div class="focus"><div class="ftitle">Night ${S.phase.n} is done</div><p>Everyone has had their turn.</p><button class="btn primary big" data-act="advance">${ic('sun')}Everyone wakes up: start day ${S.phase.n}</button></div>`;
  return `<h2>Night ${S.phase.n}</h2>
    <div class="progress"><span style="width:${active.length?doneN/active.length*100:100}%"></span></div>
    ${card}
    <div class="legend"><span>${ic('eye')}shows a screen to a player</span><span>${ic('target')}click the seat they point at</span><span>Enter = Done · Esc = close</span></div>
    <h3>Tonight so far</h3>${phaseRecap(phaseLabel())}
    <h3>Night order</h3>
    <button class="btn small orderbtn" data-act="toggleorder"><span>${ic('list')}${doneN} of ${active.length} done</span><span>${ui.showOrder?'Hide':'Show all'}</span></button>
    ${ui.showOrder?`<ul class="steps" style="margin-top:8px">${rows}</ul>`:''}
    ${cur?`<div style="margin-top:12px"><button class="btn big" data-act="advance">${ic('skip')}Skip the rest and start the day</button></div>`:''}`;
}

function dayHTML(){
  const d = S.day, a = voters().length;
  const dead = S.players.filter(p=>!p.alive || p.fake), ghosts = dead.filter(p=>p.ghost).length;
  const parts = [`<h2>Day ${S.phase.n}</h2>`];
  parts.push(`<div class="counts" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><b>${a}</b>alive</div><div><b>${needed()}</b>votes needed to pass</div><div><b>${ghosts}</b>ghost vote${ghosts===1?'':'s'} left</div></div>`);
  parts.push(`<p class="muted" style="margin-top:0">A nomination needs at least ${needed()} votes (half the living, rounded up). If someone is already on the block, the next one has to beat their total; a tie means nobody is executed.</p>`);
  const notes = [];
  const butler = S.players.find(p=>wake(p)==='butler' && p.alive); if(butler) notes.push(`${butler.name} (Butler) may only vote if their master votes too.`);
  const zealot = S.players.find(p=>p.alive && wake(p)==='zealot' && !impaired(p)); if(zealot && alive().length>=5) notes.push(`${zealot.name} (Zealot) must vote for every nomination.`);
  S.players.filter(p=>has(p,'banshee')).forEach(b=>notes.push(`${b.name} (Banshee) may nominate twice today and vote twice per nomination.`));
  if(S.players.some(p=>p.alive && p.role==='legion' && !impaired(p))) notes.push('Legion: if only evil players voted for the executed player, the execution fails. Use "Execution fails" below.');
  if(notes.length) parts.push(`<ul class="recapl">${notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  parts.push(`<div class="row" style="margin-bottom:10px"><button class="btn small" data-act="town">${ic('people')}Show the town</button><span class="muted" style="font-size:.82rem">Players who open this page's link see only this public view.</span></div>`);
  if(!d.executed) parts.push(`<h3 style="margin-top:4px">Talking time</h3>${timerHTML()}<div style="height:10px"></div>`);
  if(dead.length) parts.push(`<h3>Ghost votes</h3><p class="muted" style="margin:0 0 6px">Click a dead player when they use their one vote.</p><div class="row">${dead.map(p=>`<button class="btn small ${p.ghost?'primary':''}" data-act="ghost" data-id="${p.id}" title="${p.ghost?'Click when they use it':'Click to give it back'}">${ic('hand')}${esc(p.name)}: ${p.ghost?'has vote':'used'}</button>`).join('')}</div>`);
  const nomWatch = S.players.some(p=>p.alive && ((wake(p)==='virgin' && !has(p,'noability')) || has(p,'cursed') || (abilityOf(p)==='golem' && !has(p,'noability')) || wake(p)==='towncrier'));
  if(nomWatch && !d.executed && !S.winner){
    const who = [...new Set(S.players.filter(p=>p.alive).map(p=>wake(p)==='virgin'&&!has(p,'noability')?'Virgin':has(p,'cursed')?'Witch':abilityOf(p)==='golem'&&!has(p,'noability')?'Golem':wake(p)==='towncrier'?'Town Crier':null).filter(Boolean))];
    parts.push(`<h3>Nominations (optional)</h3><p class="muted" style="margin:0 0 6px">The ${who.join(', ')} ${who.length>1?'react':'reacts'} to nominations. Record them here and the app handles it. Votes are up to you.</p><button class="btn small" data-act="pick" data-kind="nominator">${ic('hand')}Record a nomination</button>`);
  }
  if(d.noms.length) parts.push(`<ul class="noms">${d.noms.map(x=>`<li>${esc(P(x.nominator).name)} nominated ${esc(P(x.nominee).name)}</li>`).join('')}</ul>`);
  const slayer = S.players.find(p=>p.alive && wake(p)==='slayer' && !p.rem.some(r=>r.type==='noability'));
  if(slayer) parts.push(`<h3>Slayer</h3><button class="btn small" data-act="pick" data-kind="slayer" data-actor="${slayer.id}">${ic('target')}${esc(slayer.name)} shoots someone</button>`);
  const psy = S.players.find(p=>p.alive && wake(p)==='psychopath');
  if(psy && !d.psycho && !d.executed) parts.push(`<h3>Psychopath</h3><p class="muted">Before nominations, ${esc(psy.name)} may publicly kill a player.</p><button class="btn small" data-act="pick" data-kind="psychopath" data-actor="${psy.id}">${ic('target')}${esc(psy.name)} kills someone</button>`);
  if(d.rosh && P(d.rosh)?.alive) parts.push(`<h3>Roshambo</h3><p class="muted">${esc(P(d.rosh).name)} (Psychopath) plays rock-paper-scissors with their nominator.</p><div class="row"><button class="btn danger" data-act="rosh" data-v="lose">${ic('cross')}They lost: they die</button><button class="btn" data-act="rosh" data-v="win">They won: they live</button></div>`);
  const mads = S.players.filter(p=>p.rem.some(r=>['cmad','hmad','cursed','claimed'].includes(r.type)));
  if(mads.length) parts.push(`<h3>Watch today</h3><ul class="recapl">${mads.map(p=>`<li>${esc(p.name)}: ${p.rem.filter(r=>['cmad','hmad','cursed','claimed'].includes(r.type)).map(r=>esc(r.label)).join(', ')}</li>`).join('')}</ul>${mads.some(p=>has(p,'cmad'))?'<p class="muted">Cerenovus: if they don\'t act mad, you may execute them (Execute someone). Nobody has to vote.</p>':''}${mads.some(p=>has(p,'hmad'))?'<p class="muted">Harpy: if they don\'t act mad, you may kill them, the 2nd player, or both (Mark dead on their seat).</p>':''}`);
  const dayAb = S.players.filter(p=>p.alive && R[wake(p)]?.day && !(R[wake(p)].once && has(p,'noability')) && !(wake(p)==='juggler' && S.phase.n>1));
  if(dayAb.length) parts.push(`<h3>Day abilities</h3><ul class="recapl">${dayAb.map(p=>`<li>${esc(p.name)} (${R[wake(p)].name}) ${esc(R[wake(p)].day)}${R[wake(p)].once?` <button class="btn small" data-act="usedonce" data-id="${p.id}">Mark used</button>`:''}${wake(p)==='goblin'&&!has(p,'claimed')?` <button class="btn small" data-act="addrem" data-id="${p.id}" data-type="claimed">They claimed Goblin</button>`:''}${wake(p)==='savant'?` <button class="btn small" data-act="savant" data-id="${p.id}">${ui.savant?.id===p.id?'Another pair':'Suggest 2 statements'}</button>`:''}${ui.savant?.id===p.id?savantHTML():''}</li>`).join('')}</ul>`);
  if(S.players.some(p=>p.role==='leviathan' && p.alive)) parts.push(`<p class="warn">Leviathan: ${S.goodExecs||0} good player${S.goodExecs===1?'':'s'} executed (2 means evil wins). ${S.phase.n>=5?'This is day 5: evil wins tonight unless the Leviathan dies.':`Evil wins after day 5 (this is day ${S.phase.n}).`}</p>`);
  if(S.players.some(p=>p.role==='vortox' && p.alive && !impaired(p))) parts.push('<p class="warn">Vortox: if nobody is executed today, evil wins.</p>');
  if(a===3 && S.players.some(p=>p.alive&&p.role==='mayor'&&!impaired(p))) parts.push('<p class="warn">Three players left and the Mayor lives: if nobody is executed today, good wins.</p>');
  parts.push('<h3>End of day</h3>');
  if(d.executed) parts.push(`<p>${esc(P(d.executed).name)} was executed.</p>`);
  else if(!S.winner) parts.push(`<div class="row"><button class="btn danger big" style="flex:1" data-act="pick" data-kind="execute">${ic('cross')}Execute someone</button>${S.players.some(p=>p.alive && p.role==='legion')?`<button class="btn" data-act="pick" data-kind="execfail">Execution fails</button>`:''}</div>`);
  parts.push(`<div style="margin-top:8px"><button class="btn ${d.executed?'primary':''} big" data-act="advance">${ic('moon')}${d.executed?'':'No execution: '}Night falls</button></div>`);
  parts.push(`<h3>Today so far</h3>${phaseRecap(phaseLabel())}`);
  return parts.join('');
}

function savantHTML(){
  const v = ui.savant;
  return `<div class="savant">${v.items.map(x=>`<div><span class="${x.truth?'t':'f'}">${x.truth?'TRUE':'FALSE'}</span> · ${esc(x.text)}</div>`).join('')}
    ${v.vortox?'<div class="f">The Vortox is alive, so both statements are false.</div>':''}${v.impaired?'<div class="muted">They are drunk or poisoned, so you may make both false.</div>':''}
    <div class="row"><button class="btn small primary" data-act="savantshow">${ic('eye')}Show the Savant</button><button class="btn small" data-act="savantclear">Close</button></div>
    <div class="muted" style="font-size:.8rem">Suggestions only. You can say anything you like.</div></div>`;
}
function playerHTML(){
  const p = P(ui.sel);
  const back = `<button class="btn small" style="margin-bottom:10px" data-act="tab" data-k="main">← Back to ${S.stage!=='game'?'setup':S.phase.kind==='night'?'the night order':'the day'}</button>`;
  if(!p) return back + '<p class="muted">Click a seat to see that player.</p>';
  return back + playerBody(p);
}
function playerBody(p){
  const opt = sel => charOpts(sel, [...new Set([...scriptRoles(), ...S.players.map(q=>q.role).filter(Boolean)])]);
  const parts = [`<h2>${esc(p.name)}</h2>`];
  parts.push(`<div class="row"><label class="f">Name<input type="text" id="pn-${p.id}" data-change="pname" data-id="${p.id}" value="${esc(p.name)}"></label>
    ${S.stage!=='players'&&S.stage!=='chars'?`<label class="f">Character<select id="pr-${p.id}" data-change="role" data-id="${p.id}">${opt(p.role)}</select></label>`:''}
    ${THINKS.includes(p.role)?`<label class="f">Thinks they are<select id="ps-${p.id}" data-change="shown" data-id="${p.id}">${charOpts(p.shown, Object.keys(R).filter(k=>R[k].team===(p.role==='lunatic'?'demon':'townsfolk') && (scriptRoles().includes(k)||k===p.shown)))}</select></label>`:''}
    ${['alchemist','philosopher','pixie','cannibal'].includes(p.role)&&S.stage!=='players'?`<label class="f">Has the ability of<select id="pa-${p.id}" data-change="as" data-id="${p.id}"><option value="">their own</option>${charOpts(p.as, Object.keys(R).filter(k=>R[k].team!=='fabled'))}</select></label>`:''}
    ${S.stage==='game'?`<label class="f">Team<select id="pt-${p.id}" data-change="align" data-id="${p.id}"><option value="good" ${!isEvil(p)?'selected':''}>Good</option><option value="evil" ${isEvil(p)?'selected':''}>Evil</option></select></label>`:''}</div>`);
  if(!p.role) return parts.join('');
  if(S.stage==='game') parts.push('<p class="warn">Only change a character mid-game to fix a mistake. The new character takes effect from now on, and the change is noted in the Summary.</p>');
  parts.push(`<p class="ability">${esc(R[p.role].ability)}</p>`);
  parts.push(`<div class="row"><button class="btn small" data-act="reveal" data-id="${p.id}">Show them their character</button></div>`);
  if(S.stage!=='game') return parts.join('');
  const acts = [];
  if(p.alive) acts.push(`<button class="btn small" data-act="killp" data-id="${p.id}">Mark dead</button>`);
  else { acts.push(`<button class="btn small" data-act="revive" data-id="${p.id}">Bring back to life</button>`); acts.push(`<button class="btn small" data-act="ghost" data-id="${p.id}">${p.ghost?'Ghost vote: unused':'Ghost vote: used'}</button>`); }
  parts.push(`<h3>Status</h3><div class="row">${acts.join('')}</div>`);
  parts.push(`<h3>Reminders</h3>${p.rem.length?`<ul class="rems">${p.rem.map(r=>`<li><span><span class="chip ${r.cls}${r.off?' off':''}">${esc(r.label)}</span> <span class="muted">${EXP[r.expires]}</span></span><button class="x" data-act="rmrem" data-id="${p.id}" data-r="${r.id}" aria-label="Remove ${esc(r.label)}">✕</button></li>`).join('')}</ul>`:'<p class="muted">None.</p>'}`);
  const quick = quickTokens();
  parts.push(`<h3>Add a reminder</h3><div class="row">${quick.map(t=>`<button class="btn small" data-act="addrem" data-id="${p.id}" data-type="${t}">${REM[t].label}</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="cust-${p.id}" placeholder="Your own note" aria-label="Your own note">
    <select id="custexp-${p.id}" aria-label="Lasts"><option value="never">until removed</option><option value="dawn">until dawn</option><option value="dusk">until dusk</option></select>
    <button class="btn small" data-act="addcustom" data-id="${p.id}">Add</button></div>`);
  return parts.join('');
}

const quickTokens = () => [...new Set(Object.entries(TOKEN_FOR).filter(([k])=>inPlay(k)).flatMap(([,t])=>t))];
function popHTML(p){
  const chips = [THINKS.includes(p.role)?`<span class="chip drunk">${R[p.role].name}</span>`:'', ndPoisoned(p)?'<span class="chip poison">Poisoned (No Dashii)</span>':'',
    ...p.rem.map(r=>`<button class="chip ${r.cls}${r.off?' off':''}" data-act="rmrem" data-id="${p.id}" data-r="${r.id}" title="Remove ${esc(r.label)}">${esc(r.label)} · ${EXP[r.expires]} ✕</button>`)].join('');
  const life = p.alive
    ? `<button class="btn small" data-act="killp" data-id="${p.id}">${ic('cross')}Mark dead</button>`
    : `<button class="btn small" data-act="revive" data-id="${p.id}">${ic('heart')}Revive</button><button class="btn small" data-act="ghost" data-id="${p.id}">${ic('hand')}${p.ghost?'Has ghost vote':'Ghost vote used'}</button>`;
  const add = quickTokens().filter(t=>!has(p,t));
  return `<div class="pop" role="dialog" aria-label="${esc(p.name)}">
    <div class="pophead"><span class="mini" style="width:48px;height:48px;flex:none">${tokenSVG(seen(p))}</span><div style="flex:1"><b>${esc(p.name)}</b><span class="prole ${team(p)||''}">${esc(roleLabel(p))}${p.alive?'':' · dead'}</span></div><button class="x" data-act="closepop" aria-label="Close">${ic('x')}</button></div>
    <div class="ability" style="font-size:.82rem">${esc(R[p.role]?.ability||'')}</div>
    ${chips?`<div class="marks">${chips}</div>`:''}
    <div class="row">${life}<button class="btn small" data-act="reveal" data-id="${p.id}">${ic('eye')}Show character</button></div>
    ${add.length?`<div class="row">${add.map(t=>`<button class="btn small" data-act="addrem" data-id="${p.id}" data-type="${t}">${ic('plus')}${REM[t].label}</button>`).join('')}</div>`:''}
    <button class="btn small" data-act="moreplayer" data-id="${p.id}">${ic('more')}Name, character and notes</button>
  </div>`;
}
function menuHTML(){
  const m = ui.menu, p = m && P(m.id); if(!p) return '';
  const items = [];
  if(S.stage==='game'){
    items.push(p.alive ? `<button data-act="killp" data-id="${p.id}">${ic('cross')}Mark dead</button>` : `<button data-act="revive" data-id="${p.id}">${ic('heart')}Revive</button><button data-act="ghost" data-id="${p.id}">${ic('hand')}${p.ghost?'Use their ghost vote':'Give ghost vote back'}</button>`);
    if(S.phase.kind==='day' && p.alive && !S.day.executed) items.push(`<button data-act="execute" data-id="${p.id}">${ic('cross')}Execute now</button>`);
    items.push('<hr>');
    quickTokens().forEach(t=>{ const r = p.rem.find(x=>x.type===t);

function resize(want){
  const nm = S.players.map(q=>q.name);
  while(nm.length<want) nm.push(SAMPLE.find(s=>!nm.includes(s)) || `Seat ${nm.length+1}`);
  S.players = nm.slice(0,want).map(name=>({id:uid(),name,role:null,shown:null,alive:true,ghost:true,rem:[],revealed:false}));

let downloads = null, tokenTarget = null;
async function saveFile(){
  const data = JSON.stringify({app:'tb-grimoire', v:2, savedAt:new Date().toISOString(), state:S});
  const name = `grimoire-${S.stage==='game' ? phaseLabel().toLowerCase().replace(' ','') : 'setup'}-${new Date().toISOString().slice(0,10)}.json`;
  if(downloads){
    try{ await downloads.save({filename:name, data}); ui.msg = 'Game saved to a file. Use "Open game" to load it later.'; return render(); }
    catch(e){ if(e?.code==='declined'){ ui.msg = 'Save cancelled.'; return render(); } }
  }
  try{ await navigator.clipboard.writeText(data); ui.msg = "Files can't be saved here, so the game was copied instead. Paste it into a text file ending in .json to keep it."; }
  catch(e){ ui.msg = "This view can't save or copy files. Open the page in claude.ai to save the game."; }
  render();
}
async function saveText(name, data){
  if(downloads){ try{ await downloads.save({filename:name, data}); ui.msg = 'Game record saved.'; return render(); }catch(e){ if(e?.code==='declined'){ ui.msg = 'Save cancelled.'; return render(); } } }
  try{ await navigator.clipboard.writeText(data); ui.msg = "Files can't be saved here, so the record was copied instead."; }catch(e){ ui.msg = "This view can't save files. Open the page in claude.ai to save it."; }
  render();
}
function openGame(text){
  let d; try{ d = JSON.parse(text); }catch(e){ ui.msg = "That file isn't a saved game."; return render(); }
  const st = d?.app==='tb-grimoire' ? d.state : (d?.players && d?.stage ? d : null);
  if(st && !st.script) st.script = st.teensy ? 'teensy' : 'tb';
  if(!st || !Array.isArray(st.players)){ ui.msg = "That file isn't a saved grimoire game."; return render(); }
  commit(()=>{ S = st; ui.pick=null; ui.vote=null; ui.recap=null; ui.pop=null; ui.show=null; ui.form={}; ui.open=null; ui.tab='main'; log(`Game opened from a file${d.savedAt?` saved ${new Date(d.savedAt).toLocaleString()}`:''}.`); });
  ensureConsistent(); render();
}
function moveSeat(p, dir){
  const n = S.players.length, i = S.players.indexOf(p), j = (i+dir+n)%n;
  [S.players[i], S.players[j]] = [S.players[j], S.players[i]];
  log(`${p.name} moved to sit between ${S.players[(j-1+n)%n].name} and ${S.players[(j+1)%n].name}.`);
}
const normName = f => f.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z]/g,'');
function readImage(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = ()=>{ const img = new Image(); img.onerror = rej; img.onload = ()=>{
      const c = document.createElement('canvas'); c.width = c.height = 240;
      const sc = Math.min(240/img.width, 240/img.height), w = img.width*sc, h = img.height*sc;
      c.getContext('2d').drawImage(img, (240-w)/2, (240-h)/2, w, h);
      res(c.toDataURL('image/webp', .85)); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function addTokenFiles(files, only){
  const matched = [], missed = [];
  for(const f of files){
    let k = only;
    if(!k){ const n = normName(f.name); k = Object.keys(R).filter(r=>n.includes(r)).sort((a,b)=>b.length-a.length)[0]; }
    if(!k){ missed.push(f.name); continue; }
    try{ tokenImg[k] = await readImage(f); matched.push(R[k].name); }catch(e){ missed.push(f.name); }
  }
  if(saveTokens()) ui.msg = `${matched.length?`Token images set for ${matched.join(', ')}.`:''}${missed.length?` Couldn't match: ${missed.join(', ')}. Name files after characters, like fortune_teller.png.`:''}`.trim();
  render();
}
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='loadFile' && t.files[0]){ const fr = new FileReader(); fr.onload = ()=>openGame(fr.result); fr.readAsText(t.files[0]); t.value=''; }
  if(t.id==='tokenFiles' && t.files.length){ addTokenFiles([...t.files]); t.value=''; }
  if(t.id==='tokenOne' && t.files[0] && tokenTarget){ addTokenFiles([t.files[0]], tokenTarget); t.value=''; }
});

/* ---------- events ---------- */
let wakeLock = null;
async function keepAwake(){ try{ if(!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); wakeLock?.addEventListener('release',()=>wakeLock=null); }catch(e){} }

    case 'killp': return commit(()=>kill(p,'marked dead by you'));
    case 'revive': return commit(()=>{ p.alive=true; p.ghost=true; log(`${p.name} is alive again.`); });
    case 'ghost': return commit(()=>{ p.ghost=!p.ghost; log(p.ghost ? `${p.name} gets their ghost vote back.` : `${p.name} used their ghost vote.`); });
    case 'sheetpdf': ui.msg = 'Making the PDF…'; render(); sheetCanvas().then(c=>saveData(sheetName('pdf'), pdfFromCanvas(c), 'Character sheet saved as a PDF.')); return;
    case 'sheetpng': ui.msg = 'Making the image…'; render(); sheetCanvas().then(c=>c.toBlob(b=>saveData(sheetName('png'), b, 'Character sheet saved as an image.'), 'image/png')); return;
    case 'sheetcopy': {
      const blob = sheetCanvas().then(c=>new Promise(r=>c.toBlob(r,'image/png')));
      try{ navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(()=>{ ui.msg = 'Character sheet copied. Paste it into your group chat.'; render(); }, ()=>{ ui.msg = 'Your browser blocked copying the image here. Use "Save as image" or "Save as PDF" instead.'; render(); }); }

      return; }
    case 'qr': ui.show = ui.show?.qr ? null : {qr:true}; if(ui.show) note('Showed the phone QR code.'); return render();
    case 'qrcopy': navigator.clipboard?.writeText(phoneLink()).then(()=>{ ui.msg = 'Phone link copied. Anyone with it can pick any name, so only send it to your players.'; render(); }, ()=>{ ui.msg = "Couldn't copy here. Use the QR code instead."; render(); }); return;
    case 'sheettext': navigator.clipboard?.writeText(sheetText()).then(()=>{ ui.msg = 'Character list copied as text.'; render(); }, ()=>{ ui.msg = "Couldn't copy here. Try \"Save as PDF\"."; render(); }); return;
    case 'savant': ui.savant = savantPair(p); return render();
    case 'savantclear': ui.savant = null; return render();
    case 'savantshow': { const v = ui.savant; if(!v) return; ui.show = {eyebrow:'One of these is true. One is false.', lines:v.items.map(x=>x.text), tone:'good'};

    case 'spyview': ui.show = {spy:true}; note('Showed the grimoire.'); return render();
    case 'recview': ui.viewRec = id || null; ui.confirmDel = null; return render();
    case 'recdel': if(ui.confirmDel!==id){ ui.confirmDel = id; return render(); } saveHist(loadHist().filter(h=>h.id!==id)); ui.confirmDel = null; ui.viewRec = null; ui.msg = 'Game removed.'; return render();
    case 'reccopy': case 'recsave': {
      const rec = id==='current' ? makeRecord() : loadHist().find(h=>h.id===id); if(!rec) return;

      navigator.clipboard?.writeText(text).then(()=>{ ui.msg = 'Game record copied. Paste it into a message or a note.'; render(); }, ()=>{ ui.msg = "Couldn't copy here. Try \"Save as a file\"."; render(); });
      return; }

    case 'addrem': return commit(()=>{ const t=el.dataset.type; if(['poisoned','master','redherring'].includes(t)) dropRem(t); addRem(p,t); log(`${p.name}: ${REM[t].label}, ${EXP[REM[t].expires]}.`); });
    case 'addcustom': {

    case 'clearwin': return commit(()=>{ S.winner=null; });

    case 'youare': ui.show = cardYouAre(p); note(`Showed ${p.name} they are now the ${R[seen(p)].name}.`); return render();
    case 'charpick': { const k = el.dataset.k, a = P(el.dataset.actor), r = ui.form[k]?.role; if(!r) return;

        else { a.as = r; const holder = S.players.find(q=>q!==a && wake(q)===r); if(holder) addRem(holder,'drunk',{label:'Drunk (Philosopher)'}); log(`Philosopher ${a.name} gains the ${R[r].name} ability.${holder?` ${holder.name} has that character, so they are drunk from now on.`:''}`); }
        S.picked[k] = R[r].name; }); }

    case 'alhres': { const f = ui.form.alhadikhia; if(!f || f.done) return; const ps = f.ids.map(P);
      return commit(()=>{ f.done = true; const a = S.players.find(q=>q.role==='alhadikhia');
        if(a && impaired(a)){ log('The Al-Hadikhia is drunk or poisoned, so nobody dies.'); return; }
        const dying = ps.every(q=>f.live[q.id]==='live') ? ps : ps.filter(q=>f.live[q.id]==='die');
        if(dying===ps && ps.every(q=>f.live[q.id]==='live')) log('All three chose to live, so all three die.');
        dying.forEach(q=>demonHit(a||q,q)); }); }
    case 'tinkerdie': return commit(()=>kill(p,'the Tinker died'));
    case 'moonkill': return commit(()=>{ p.rem = p.rem.filter(r=>r.type!=='moon'); if(!isEvil(p)) nightKill(p,'chosen by the Moonchild'); else log(`${p.name} is evil, so the Moonchild's choice does nothing.`); S.done.moonchild = true; });
    case 'rosh': { const q = P(S.day.rosh); return commit(()=>{ S.day.rosh = null; if(el.dataset.v==='lose'){ log(`${q.name} lost roshambo.`); kill(q,'executed'); } else log(`${q.name} won roshambo and lives.`); }); }
    case 'usedonce': return commit(()=>{ addRem(p,'noability'); log(`${p.name} used their ${R[wake(p)].name} ability.`); });
    case 'undo': {
      if(!undo.length) return;
      const u = undo[undo.length-1], prev = JSON.parse(u.s);
      if(S.stage==='game' && prev.stage!=='game'){ ui.msg = "The game has started, so Undo stops here. Use New game to go back to setup."; return render(); }
      undo.pop(); S = prev; ui.pick=null; ui.vote=null; ui.recap=null; ui.pop=null; ui.msg = `Undid: ${u.what}`; ensureConsistent(); save(); return render();
    }
    case 'newgame':
      if(!ui.confirmNew){ ui.confirmNew = true; return render(); }
      archiveGame();
      undo.push({s:JSON.stringify(S), what:'New game'});
      { const names0 = S.players.map(q=>q.name), sc = S.script; S = fresh(names0.length); S.script = sc; S.players.forEach((q,i)=>q.name=names0[i]); }
      timer.running = false; timer.left = 0;
      ui = {sel:null, tab:'main', pick:null, vote:null, msg:null, show:null, confirmNew:false, form:{}, open:null, pop:null, menu:null, recap:null};
      save(); return render();
  }
});

function note(t){ log(t); save(); }
function noteShow(k){
  const f = ui.form[k] || {}, st = stepDef(k) || {};
  if(k==='minioninfo') return note('Showed the Minions who the Demon is.');
  if(k==='demoninfo') return note(`Showed the Demon their Minions and bluffs: ${S.bluffs.map(b=>R[b].name).join(', ')}.`);
  if(k==='newimp') return note('Showed the new Demon their character.');
  if(st.info==='pair' && f.role) return note(`Showed the ${R[k].name}: ${R[f.role].name}, either ${P(f.a)?.name} or ${P(f.b)?.name}.`);
  if(st.info==='number') return note(`Showed the ${R[k].name}: ${f.n??0}.`);
  if(st.info==='character' && f.role){
    if(k==='pixie'){ dropRem('pixiemad'); const t = S.players.find(p=>p.role===f.role); if(t) addRem(t,'pixiemad'); }
    return note(`Showed the ${R[k].name}: ${R[f.role].name}.`);
  }
  if(st.info==='player' && f.p){
    if(k==='bountyhunter'){ dropRem('bhknow'); addRem(P(f.p),'bhknow'); }
    if(k==='balloonist') (S.flags ||= {}).balloon = team(P(f.p));
    return note(`Showed the ${R[k].name}: ${P(f.p).name}.`);
  }
  if(st.info==='pair2') return note(`Showed the ${R[k].name}: ${P(f.a)?.name} or ${P(f.b)?.name}.`);
  if(st.info==='dream') return note(`Showed the Dreamer: ${R[f.g]?.name} and ${R[f.e]?.name}.`);
}

/* right-click menu, long-press, drag to reorder, keyboard */
let suppressClick = false, pressTimer = null, dragId = null;
document.addEventListener('contextmenu', e=>{
  const seat = e.target.closest('.seat'); if(!seat) return;
  e.preventDefault(); ui.pop = null; ui.menu = {id:seat.dataset.id, x:e.clientX, y:e.clientY}; render();
});
document.addEventListener('pointerdown', e=>{
  const seat = e.target.closest('.seat'); if(!seat || e.pointerType==='mouse') return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(()=>{ suppressClick = true; ui.menu = {id:seat.dataset.id, x:e.clientX, y:e.clientY}; render(); }, 550);
});
['pointerup','pointercancel','pointermove'].forEach(t=>document.addEventListener(t, e=>{ if(t!=='pointermove' || Math.abs(e.movementX)+Math.abs(e.movementY)>6) clearTimeout(pressTimer); }));
document.addEventListener('dragstart', e=>{
  const seat = e.target.closest('.seat'); if(!seat || ui.pick || ui.vote){ e.preventDefault(); return; }
  dragId = seat.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
  ui.pop = null; ui.menu = null; requestAnimationFrame(()=>seat.classList.add('dragging'));
});
document.addEventListener('dragover', e=>{ if(!dragId && [...(e.dataTransfer?.types||[])].includes('Files')){ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
document.addEventListener('drop', e=>{
  if(dragId || !e.dataTransfer?.files?.length) return;
  e.preventDefault();
  const imgs = [...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
  const json = [...e.dataTransfer.files].find(f=>f.name.endsWith('.json'));
  if(imgs.length) addTokenFiles(imgs);
  else if(json){ const fr = new FileReader(); fr.onload = ()=>openGame(fr.result); fr.readAsText(json); }
});
document.addEventListener('dragover', e=>{
  const seat = e.target.closest('.seat'); if(!seat || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.seat.dropto').forEach(s=>s!==seat && s.classList.remove('dropto'));
  if(seat.dataset.id!==dragId) seat.classList.add('dropto');
});
document.addEventListener('dragend', ()=>{ dragId = null; document.querySelectorAll('.dropto,.dragging').forEach(s=>s.classList.remove('dropto','dragging')); });
document.addEventListener('drop', e=>{
  const seat = e.target.closest('.seat'); if(!seat || !dragId) return;
  e.preventDefault();
  const from = S.players.findIndex(p=>p.id===dragId), to = S.players.findIndex(p=>p.id===seat.dataset.id);
  dragId = null;
  if(from<0 || to<0 || from===to) return render();
  commit(()=>{ const [p] = S.players.splice(from,1); S.players.splice(to,0,p);
    const n = S.players.length, i = S.players.indexOf(p);
    log(`${p.name} moved to sit between ${S.players[(i-1+n)%n].name} and ${S.players[(i+1)%n].name}.`); });
});
document.addEventListener('keydown', e=>{
  if(phoneMode) return;
  const typing = e.target.closest('input,select,textarea');
  if(e.key==='Escape'){
    if(ui.menu) ui.menu = null;
    else if(ui.show) return document.querySelector('.show')?.click();
    else if(ui.preview) ui.preview = null;
    else if(ui.recap) ui.recap = null;
    else if(ui.pop) ui.pop = null;
    else if(ui.pick && !['starpass','mayor'].includes(ui.pick.kind)) ui.pick = null;
    else if(ui.vote) ui.vote = null;
    else return;
    return render();
  }
  if(typing) return;
  if((e.key==='Enter' || e.key===' ') && e.target.closest('.seat')){ e.preventDefault(); return e.target.closest('.seat').click(); }
  if(e.target.closest('button')) return;
  if(e.key==='Enter'){
    if(ui.show) return document.querySelector('.show')?.click();
    if(ui.recap) return document.querySelector('[data-act=recapgo]')?.click();
    const done = document.querySelector('.focus [data-act=done]');

/* ---------- QR code (byte mode, error level M) ---------- */
function qrMatrix(text){
  const data = [...new TextEncoder().encode(text)];
  const ECW = [0,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const NB = [0,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const raw = v => { let r = (16*v+128)*v+64; if(v>=2){ const a = Math.floor(v/7)+2; r -= (25*a-10)*a-55; if(v>=7) r -= 36; } return r; };
  const cap = v => Math.floor(raw(v)/8) - ECW[v]*NB[v];
  let v = 1; while(v<=40 && 4+(v<10?8:16)+data.length*8 > cap(v)*8) v++;
  if(v>40) return null;
  const bits = [], put = (x,len) => { for(let i=len-1;i>=0;i--) bits.push((x>>>i)&1); };
  put(4,4); put(data.length, v<10?8:16); data.forEach(b=>put(b,8));
  const capBits = cap(v)*8;
  put(0, Math.min(4, capBits-bits.length)); put(0, (8-bits.length%8)%8);
  for(let pad=0xEC; bits.length<capBits; pad^=0xEC^0x11) put(pad,8);
  const dc = []; for(let i=0;i<bits.length;i+=8) dc.push(bits.slice(i,i+8).reduce((a,b)=>a<<1|b,0));
  const mul = (x,y) => { let z = 0; for(let i=7;i>=0;i--){ z = (z<<1)^((z>>>7)*0x11D); z ^= ((y>>>i)&1)*x; } return z; };
  const deg = ECW[v], div = Array(deg).fill(0); div[deg-1] = 1;
  for(let i=0, root=1; i<deg; i++, root=mul(root,2)) for(let j=0;j<deg;j++){ div[j] = mul(div[j],root); if(j+1<deg) div[j] ^= div[j+1]; }
  const rem = d => { const r = Array(deg).fill(0); d.forEach(b=>{ const f = b^r.shift(); r.push(0); div.forEach((c,i)=>r[i]^=mul(c,f)); }); return r; };
  const nb = NB[v], total = Math.floor(raw(v)/8), nShort = nb - total%nb, shortLen = Math.floor(total/nb);
  const blocks = []; for(let i=0,k=0;i<nb;i++){ const d = dc.slice(k, k+shortLen-deg+(i<nShort?0:1)); k += d.length; const e = rem(d); if(i<nShort) d.push(0); blocks.push(d.concat(e)); }
  const cw = []; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==shortLen-deg || j>=nShort) cw.push(b[i]); });
  const n = 17+4*v, m = Array.from({length:n},()=>Array(n).fill(false)), fn = Array.from({length:n},()=>Array(n).fill(false));
  const set = (x,y,d) => { m[y][x] = d; fn[y][x] = true; };
  for(let i=0;i<n;i++){ set(6,i,i%2===0); set(i,6,i%2===0); }
  for(const [cx,cy] of [[3,3],[n-4,3],[3,n-4]]) for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const x = cx+dx, y = cy+dy, d = Math.max(Math.abs(dx),Math.abs(dy)); if(x>=0&&x<n&&y>=0&&y<n) set(x,y,d!==2&&d!==4); }
  if(v>1){ const na = Math.floor(v/7)+2, step = Math.floor((v*8+na*3+5)/(na*4-4))*2, pos = [6]; for(let p=n-7; pos.length<na; p-=step) pos.splice(1,0,p);
    pos.forEach((ax,i)=>pos.forEach((ay,j)=>{ if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0)) return; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) set(ax+dx,ay+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); })); }
  const format = mask => { const d = mask; let r = d; for(let i=0;i<10;i++) r = (r<<1)^((r>>>9)*0x537); const b = ((d<<10)|r)^0x5412, g = i => ((b>>>i)&1)===1;
    for(let i=0;i<=5;i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9;i<15;i++) set(14-i,8,g(i));
    for(let i=0;i<8;i++) set(n-1-i,8,g(i)); for(let i=8;i<15;i++) set(8,n-15+i,g(i)); set(8,n-8,true); };
  format(0);
  if(v>=7){ let r = v; for(let i=0;i<12;i++) r = (r<<1)^((r>>>11)*0x1F25); const b = (v<<12)|r; for(let i=0;i<18;i++){ const d = ((b>>>i)&1)===1, a = n-11+i%3, c = Math.floor(i/3); set(a,c,d); set(c,a,d); } }
  let i = 0;
  for(let right=n-1; right>=1; right-=2){ if(right===6) right = 5;
    for(let vert=0; vert<n; vert++) for(let j=0;j<2;j++){ const x = right-j, y = ((right+1)&2)===0 ? n-1-vert : vert;
      if(!fn[y][x] && i<cw.length*8){ m[y][x] = ((cw[i>>>3]>>>(7-(i&7)))&1)===1; i++; } } }
  const MASKS = [(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const flip = k => { for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(!fn[y][x] && MASKS[k](x,y)) m[y][x] = !m[y][x]; };
  const score = () => { let s = 0, dark = 0; const lines = [];
    for(let y=0;y<n;y++){ lines.push(m[y].map(b=>b?1:0).join('')); lines.push(m.map(r=>r[y]?1:0).join('')); }
    lines.forEach(l=>{ (l.match(/0{5,}|1{5,}/g)||[]).forEach(r=>s+=r.length-2); const p = '0000'+l+'0000'; for(const f of ['10111010000','00001011101']) for(let k=p.indexOf(f); k>=0; k=p.indexOf(f,k+1)) s += 40; });
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){ if(m[y][x]) dark++; if(x<n-1&&y<n-1&&m[y][x]===m[y][x+1]&&m[y][x]===m[y+1][x]&&m[y][x]===m[y+1][x+1]) s += 3; }
    return s + (Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10; };
  let best = 0, bestScore = Infinity;
  for(let k=0;k<8;k++){ flip(k); format(k); const sc = score(); if(sc<bestScore){ best = k; bestScore = sc; } flip(k); }
  flip(best); format(best);
  return m;
}
function qrSVG(text){
  const m = qrMatrix(text); if(!m) return '';
  const n = m.length; let d = '';
  m.forEach((row,y)=>row.forEach((on,x)=>{ if(on) d += `M${x+4} ${y+4}h1v1h-1z`; }));
  return `<svg class="qr" viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ---------- phone link: each player picks their name and sees their character ---------- */
const PAGES_URL = 'https://nathanpljohnson.github.io/blood-on-the-clocktower/';
const phoneBase = () => location.protocol==='file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? location.href.split('#')[0] : PAGES_URL;
const xorb = b => b.map((x,i)=>x^'clocktower'.charCodeAt(i%10));
function phoneLink(){
  const roles = scriptRoles();
  const ps = S.players.map(p=>{ const r = seen(p), i = roles.indexOf(r); return p.name.replace(/[|^]/g,'') + '^' + (i>=0 && i<36 ? i.toString(36) : '*'+r) + (cardYouAre(p).tone==='evil'?'!':''); });
  const b = xorb([...new TextEncoder().encode(['1', S.script==='teensy' ? 'teensy:'+roles.join(',') : S.script, ...ps].join('|'))]);
  return phoneBase() + '#p-' + btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function readPhone(code){
  try{
    const bin = atob(code.replace(/-/g,'+').replace(/_/g,'/'));
    const [ver, head, ...ps] = new TextDecoder().decode(new Uint8Array(xorb([...bin].map(c=>c.charCodeAt(0))))).split('|');
    const [sid, list] = head.split(':'), roles = (list ? list.split(',') : SCRIPTS[sid]?.roles||[]).filter(k=>R[k]);
    if(ver!=='1' || !roles.length) return null;
    const players = ps.map(x=>{ const [name, r=''] = x.split('^'), evil = r.endsWith('!'), c = evil ? r.slice(0,-1) : r; return {name, role: c[0]==='*' ? c.slice(1) : roles[parseInt(c,36)], evil}; });
    return players.every(p=>R[p.role]) ? {id:sid, name:SCRIPTS[sid]?.name||'Blood on the Clocktower', roles, fabled:SCRIPTS[sid]?.fabled||[], players} : null;
  }catch(e){ return null; }
}
const phoneMode = /^#p[-=]/.test(location.hash), phone = phoneMode ? readPhone(location.hash.slice(3)) : null;
let phoneMe = null, phoneOpen = false, phoneSheet = false, phoneImg = null, phoneFile = null, phoneReady = null;
const canSharePics = (()=>{ try{ return !!navigator.canShare?.({files:[new File([''],'a.png',{type:'image/png'})]}); }catch(e){ return false; } })();
const saveLabel = canSharePics ? 'Save to photos' : 'Save image';

  return phoneReady ||= (async ()=>{

}

}
function phoneHTML(){
  if(!phone) return `<div class="town phone"><h1>Blood on the Clocktower</h1><p class="muted">This link doesn't work. Ask the Storyteller to show the QR code again.</p></div>`;
  const me = phone.players[phoneMe], d = DIST[phone.players.length];
  const top = !me ? `<h2>Who are you?</h2><div class="pnames">${phone.players.map((p,i)=>`<button class="btn" data-act="pme" data-i="${i}">${esc(p.name)}</button>`).join('')}</div>`

/* ---------- player view (shared board) ---------- */
let db = null, owner = true, townMode = location.hash==='#town', board = null, boardState = 'loading', lastBoard = '', boardTimer = null, writing = false;
function boardData(){
  const game = S.stage==='game', day = game && S.phase.kind==='day', d = S.day;
  return {game, phase: game ? S.phase.kind : 'setup', n: S.phase.n, script: scriptName(),
    players: S.players.map(p=>({name:p.name, alive:(p.alive && !p.fake) || (has(p,'diedtonight') && !p.fake), ghost:p.ghost})),
    needed: game ? Math.ceil(S.players.filter(p=>(p.alive && !p.fake) || has(p,'diedtonight')).length/2) : 0, toExecute: day ? dayNeed() : 0,
    block: null,
    vote: null,
    noms: [],
    timer: day ? {running:timer.running, end:timer.end, left:timer.left} : null,
    news: game ? (S.news||'') : '', winner: S.winner || null,
    record: S.revealed ? S.log.slice(0,800).reverse().map(l=>({at:l.at, t:l.t})) : null,
    reveal: S.revealed ? S.players.map(p=>({name:p.name, role:R[p.role]?.name||'', team:team(p)||'', drunkAs: THINKS.includes(p.role) ? (R[p.shown]?.name||'') : ''})) : null};
}
function publishBoard(){
  if(!db || !owner || townMode) return;
  clearTimeout(boardTimer);
  boardTimer = setTimeout(async ()=>{
    const data = boardData(), json = JSON.stringify(data);
    if(json===lastBoard || writing) return;
    writing = true;
    try{ await db.doc('public/board').set(data); lastBoard = json; }catch(e){}
    writing = false;
    if(JSON.stringify(boardData())!==lastBoard) publishBoard();
  }, 400);
}
function townHTML(){
  if(boardState==='none') return `<div class="town"><h1>Town square</h1><p class="muted">The player view needs you to be signed in to claude.ai with access to this page. Ask the Storyteller to share it with you.</p></div>`;

  const b = board, a = b.players.filter(p=>p.alive).length;
  if(!b.game) return `<div class="town"><h1>Town square</h1><div class="big">Setting up</div><p class="muted">The Storyteller is preparing a ${esc(b.script||'Trouble Brewing')} game for ${b.players.length} players.</p></div>`;

    ${b.timer && (b.timer.running||b.timer.left>0)?`<div class="timerbox"><span>Talking time</span><span class="timer" data-towntimer>${fmt(tl)}</span></div>`:''}
    ${b.vote?`<div class="vote"><div><b>${esc(b.vote.from)}</b> nominates <b>${esc(b.vote.to)}</b></div><div class="row"><span class="tally">${b.vote.count}</span><span>votes · need ${b.toExecute}</span></div></div>`:''}
    ${b.block?`<p>${b.block.name?`On the block: <b>${esc(b.block.name)}</b> with ${b.block.votes} votes. ${b.block.votes+1} replaces them.`:`Tied at ${b.block.votes}. Nobody is on the block.`}</p>`:''}
    <h3>Players, clockwise</h3>
    <div class="pills">${b.players.map(p=>`<span class="${p.alive?'':'dead'} ${!p.alive&&p.ghost?'ghost':''}">${esc(p.name)}${p.alive?'':p.ghost?' · dead, 1 vote':' · dead'}</span>`).join('')}</div>
    ${b.noms.length?`<h3>Nominations today</h3><ul class="noms">${b.noms.map(x=>`<li>${esc(x.from)} → ${esc(x.to)}: ${x.votes} votes</li>`).join('')}</ul>`:''}
    ${b.reveal?`<h3>Everyone's character</h3><div class="final" style="max-height:none">${b.reveal.map(p=>`<span class="fr ${p.team}"><b>${esc(p.name)}</b>${esc(p.role)}${p.drunkAs?`<small>thought they were the ${esc(p.drunkAs)}</small>`:''}</span>`).join('')}</div>`:''}
    ${b.record?`<h3>What happened</h3>${groupLog(b.record).map(g=>`<h3 style="font-size:.95rem">${esc(g.at)}</h3><ul class="recapl">${g.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`).join('')}`:''}
  </div>`;
}

(async ()=>{

S = load() || fresh(8);
if(!S.script) S.script = S.teensy ? 'teensy' : 'tb';
S.flags ||= {}; S.night ||= {changed:[]}; S.lastDay ||= {};

if(phoneMode){ renderPhone(); if(phone) setTimeout(phoneSheetReady, 300); } else if(townMode) renderTown(); else render();
